<title>PixelRealm</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
	--bg: #0b0f1a; --panel: #1a2030; --panel2: #242c40; --edge: #3a4660; --edge2: #56648a;
	--text: #eef0f6; --dim: #a6adc2; --faint: #6c7590; --accent: #f2c14e; --accent2: #7fc8a9; --bad: #e06060; --good: #70e080;
	--slot: min(54px, calc((100vw - 36px) / 10)); --font: "Pixelify Sans", ui-monospace, Menlo, monospace;
	color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0f1a; --text: #eef0f6; } }
:root[data-theme="dark"] { --bg: #0b0f1a; --text: #eef0f6; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }
body { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font-family: var(--font); color: var(--text); background: var(--panel2); border: 2px solid var(--edge); border-radius: 6px; padding: 8px 12px; font-size: 15px; cursor: pointer; touch-action: manipulation; }
button:active, button.on { background: var(--edge); border-color: var(--edge2); }
button.primary { background: #3d5a3a; border-color: #5f8a58; }
button.warn { background: #5a2e2e; border-color: #8a4a4a; }
button:disabled { opacity: 0.4; }
input, select { font-family: var(--font); font-size: 16px; color: var(--text); background: #10141f; border: 2px solid var(--edge); border-radius: 6px; padding: 8px; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hidden { display: none !important; }
.ic { display: inline-block; background-image: var(--atlas); background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; }
/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#stats { position: absolute; left: max(10px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); pointer-events: none !important; }
.row { display: flex; gap: 1px; margin-bottom: 3px; }
#topRight { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); display: flex; gap: 6px; }
#topRight button { min-width: 44px; font-size: 18px; height: 44px; padding: 0 10px; background: rgba(26,32,48,0.82); }
#msg { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); padding: 6px 14px; background: rgba(10,14,24,0.78); border: 2px solid var(--edge); border-radius: 6px; font-size: 16px; pointer-events: none !important; white-space: nowrap; }
#perf { position: absolute; left: 10px; top: 72px; font-size: 12px; color: var(--dim); text-shadow: 1px 1px 0 #000; pointer-events: none !important; white-space: pre; }
#floats { position: absolute; inset: 0; pointer-events: none !important; overflow: hidden; }
#floats div { position: absolute; font-size: 14px; font-weight: 600; text-shadow: 1px 1px 0 #000, -1px 1px 0 #000; transform: translate(-50%, -50%); white-space: nowrap; }
#hotbar { position: absolute; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; background: rgba(10,14,24,0.7); border: 2px solid var(--edge); border-radius: 8px; }
.slot { position: relative; width: var(--slot); height: var(--slot); background: rgba(36,44,64,0.85); border: 2px solid var(--edge); border-radius: 5px; display: flex; align-items: center; justify-content: center; }
.slot.sel { border-color: var(--accent); background: rgba(80,70,40,0.85); }
.slot.pick { border-color: var(--accent2); box-shadow: 0 0 0 2px var(--accent2) inset; }
.slot .n { position: absolute; right: 2px; bottom: 0; font-size: 12px; font-weight: 700; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
.slot .k { position: absolute; left: 3px; top: 0; font-size: 10px; color: var(--faint); }
#stick { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: calc(var(--slot) + 30px); width: 140px; height: 140px; border-radius: 50%; background: rgba(20,26,40,0.38); border: 2px solid rgba(160,170,200,0.35); touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(220,225,240,0.5); border: 2px solid rgba(255,255,255,0.6); pointer-events: none; }
#bJump { position: absolute; right: calc(max(18px, env(safe-area-inset-right)) + 150px); bottom: calc(var(--slot) + 36px); width: 88px; height: 88px; border-radius: 50%; background: rgba(20,26,40,0.45); border: 2px solid rgba(160,170,200,0.45); font-size: 16px; font-weight: 700; touch-action: none; }
#atk { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: calc(var(--slot) + 30px); width: 140px; height: 140px; border-radius: 50%; background: rgba(48,20,20,0.34); border: 2px solid rgba(220,150,140,0.4); touch-action: none; }
#atkKnob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(240,190,180,0.5); border: 2px solid rgba(255,230,220,0.6); pointer-events: none; }
#atk.on { background: rgba(90,30,30,0.45); }
#bWeapon { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: calc(var(--slot) + 182px); width: 52px; height: 52px; padding: 0; font-size: 22px; background: rgba(26,32,48,0.7); }
body.lefty #stick { left: auto; right: max(18px, env(safe-area-inset-right)); }
body.lefty #atk { right: auto; left: max(18px, env(safe-area-inset-left)); }
body.lefty #bWeapon { right: auto; left: max(18px, env(safe-area-inset-left)); }
body.lefty #bJump { right: auto; left: calc(max(18px, env(safe-area-inset-left)) + 150px); }
/* panels */
.screen { position: absolute; inset: 0; background: rgba(6,8,14,0.72); display: flex; align-items: center; justify-content: center; padding: max(10px, env(safe-area-inset-top)) 10px 10px; }
.box { background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; width: min(860px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.top { display: flex; align-items: center; gap: 6px; padding: 8px; border-bottom: 2px solid var(--edge); background: var(--panel2); flex-wrap: wrap; }
.top .title { font-size: 18px; font-weight: 700; margin-right: auto; padding-left: 4px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 10px; flex: 1; }
.grid { display: grid; grid-template-columns: repeat(10, var(--slot)); gap: 3px; justify-content: center; }
.label { font-size: 13px; color: var(--dim); margin: 10px 2px 5px; text-transform: uppercase; letter-spacing: 1px; }
.info { margin-top: 10px; padding: 8px 10px; background: #141a28; border: 2px solid var(--edge); border-radius: 8px; min-height: 64px; }
.info .nm { font-size: 17px; font-weight: 700; }
.info .ln { font-size: 13px; color: var(--dim); }
.info .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { padding: 6px 10px; font-size: 14px; }
.recipe { display: flex; align-items: center; gap: 8px; padding: 6px; border: 2px solid var(--edge); border-radius: 8px; margin-bottom: 5px; background: #1e2536; }
.recipe.no { opacity: 0.55; }
.recipe .nm { flex: 1; font-size: 15px; }
.recipe .cost { font-size: 12px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.recipe .cost span.miss { color: var(--bad); }
.recipe button { padding: 6px 10px; }
.armor { display: flex; gap: 3px; justify-content: center; }
/* menu */
#menu { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #1e2a48 0%, #0b0f1a 70%); display: flex; align-items: center; justify-content: center; padding: 12px; }
#menu .box { width: min(560px, 100%); }
.logo { font-size: 44px; font-weight: 700; text-align: center; margin: 18px 0 2px; color: var(--accent); text-shadow: 3px 3px 0 #6a3d12; letter-spacing: 2px; }
.sub { text-align: center; color: var(--dim); font-size: 14px; margin-bottom: 14px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.col > button { padding: 12px; font-size: 17px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 13px; color: var(--dim); }
.choice { display: flex; gap: 4px; flex-wrap: wrap; }
.choice button { flex: 1; min-width: 80px; }
.world { display: flex; align-items: center; gap: 8px; padding: 8px; border: 2px solid var(--edge); border-radius: 8px; margin-bottom: 6px; background: #1e2536; }
.world .nm { flex: 1; } .world .nm b { font-size: 16px; } .world .nm div { font-size: 12px; color: var(--dim); }
.note { font-size: 12px; color: var(--faint); text-align: center; margin: 8px 0; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); font-size: 20px; color: var(--dim); }
#death .box { width: min(380px, 100%); text-align: center; padding: 18px; }
#death h2 { color: var(--bad); margin: 6px 0 10px; }
.setrow { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid #2a3248; }
.setrow .nm { flex: 1; font-size: 15px; } .setrow .nm div { font-size: 12px; color: var(--faint); }
.setrow input[type=range] { width: 150px; }
</style>

		<div id="msg" class="hidden"></div>
		<div id="perf" class="hidden"></div>
		<div id="floats"></div>
		<div id="stick"><div id="knob"></div></div>
		<button id="bJump">JUMP</button>
		<div id="atk"><div id="atkKnob"></div></div>
		<button id="bWeapon" aria-label="Next weapon">⚔</button>
		<div id="hotbar"></div>
	</div>
	<div id="panel" class="screen hidden"></div>
	<div id="pause" class="screen hidden"></div>
	<div id="death" class="screen hidden"></div>
	<div id="menu" class="hidden"></div>
	<div id="loading">Loading…</div>
</div>

// ===== p01_util.js =====
// Utilities: numbers, hashing, noise and colours (the Swift game's p01_util).
// Hashes are 32-bit here (the Swift game's are 64-bit), so the same seed gives a different but
// equally made world.

const clampD = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const clampI = clampD;
const lerpD = (a, b, t) => a + (b - a) * t;
const floorDiv = (a, b) => Math.floor(a / b);
const smooth = (f) => f * f * (3 - 2 * f);
const perfNow = () => performance.now() / 1000;

function hashU(x, y, s) {
	let h = Math.imul(x | 0, 0x9E3779B1) ^ Math.imul(y | 0, 0x85EBCA77) ^ Math.imul(s | 0, 0xC2B2AE3D);
	h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D);
	h ^= h >>> 12; h = Math.imul(h, 0x297A2D39);
	h ^= h >>> 15;
	return h >>> 0;
}
function hash2(x, y, s) { return hashU(x, y, s) / 4294967296; }

/** a small seeded random number generator (the Swift game's RNG) */
class RNG {
	constructor(seed) { this.s = (seed + 0x9E3779B9) >>> 0; }
	next() {
		this.s = (this.s + 0x6D2B79F5) >>> 0;
		let z = this.s;
		z = Math.imul(z ^ (z >>> 15), z | 1);
		z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
		return (z ^ (z >>> 14)) >>> 0;
	}
	double() { return this.next() / 4294967296; }
	int(n) { return this.next() % Math.max(1, n); }
}
const rand = (lo = 0, hi = 1) => lo + Math.random() * (hi - lo);
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

function noise1(x, s) {
	const fl = Math.floor(x);
	const u = smooth(x - fl);
	const a = hash2(fl, 7, s), b = hash2(fl + 1, 7, s);
	return a + (b - a) * u;
}
function fbm1(x, s, oct) {
	let sum = 0, amp = 1, freq = 1, norm = 0;
	for (let i = 0; i < oct; i++) { sum += noise1(x * freq, s + i * 101) * amp; norm += amp; amp *= 0.5; freq *= 2; }
	return sum / norm;
}
function vnoise(x, y, s) {
	const fx0 = Math.floor(x), fy0 = Math.floor(y);
	const u = smooth(x - fx0), v = smooth(y - fy0);
	const a = hash2(fx0, fy0, s), b = hash2(fx0 + 1, fy0, s), c = hash2(fx0, fy0 + 1, s), d = hash2(fx0 + 1, fy0 + 1, s);
	const top = a + (b - a) * u, bot = c + (d - c) * u;
	return top + (bot - top) * v;
}

// colours are 0xRRGGBB numbers, as in the Swift game
function mixRGB(a, b, t) {
	const tt = clampD(t, 0, 1);
	const ch = (s) => { const ca = (a >> s) & 255, cb = (b >> s) & 255; return Math.floor(ca + (cb - ca) * tt); };
	return (ch(16) << 16) | (ch(8) << 8) | ch(0);
}
function shadeRGB(c, f) {
	const ch = (s) => Math.floor(clampD(((c >> s) & 255) * f, 0, 255));
	return (ch(16) << 16) | (ch(8) << 8) | ch(0);
}
const gradeSat = 0.42, gradeVal = 0.20;
/** the game's colour grade: strong colours lose some saturation and brightness */
function artGrade(c) {
	const r = ((c >> 16) & 255) / 255, g = ((c >> 8) & 255) / 255, b = (c & 255) / 255;
	const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
	if (mx <= 0 || mx === mn) return c & 0xFFFFFF;
	const s = (mx - mn) / mx;
	const s2 = s * (1 - gradeSat * s);
	const v2 = mx * (1 - gradeVal * mx * s);
	const lo2 = v2 * (1 - s2);
	const ch = (x) => { const t = (x - mn) / (mx - mn); return Math.floor(clampD(Math.round((lo2 + (v2 - lo2) * t) * 255), 0, 255)); };
	return (ch(r) << 16) | (ch(g) << 8) | ch(b);
}
const hexCss = (c, a = 1) => "rgba(" + ((c >> 16) & 255) + "," + ((c >> 8) & 255) + "," + (c & 255) + "," + a + ")";

/** a mod's rules of the game; the defaults until mods are ported */
const RULES = { day: 12, gravity: 1, health: 20, hunger: 1, healing: 1, hurt: 1, hit: 1, mining: 1, monsters: 1, animals: 1, falls: 1, walk: 1, jump: 1, nights: 1, deathDrop: 0 };
const rule = (k) => RULES[k];

// ===== p02_tiles.js =====
// Tiles: the Swift game's own table (DATA.tiles), as flat lookups by tile number.

const NT = DATA.tiles.length;
/** tile numbers by name: T.grass, T.stone ... */
const T = {};
const TILE = DATA.tiles;
for (const t of TILE) T[t.key] = t.id;
const u8table = (f) => { const a = new Uint8Array(256); for (const t of TILE) a[t.id] = f(t) ? 1 : 0; return a; };
const SOLID = u8table((t) => t.solid);
const OPAQUE = u8table((t) => t.opaque);
const LIQUID = u8table((t) => t.liquid);
const PLATFORM = u8table((t) => t.platform);
const PLANT = u8table((t) => t.plant);
const HURTS = u8table((t) => t.hurt);
const IS_LEAF = u8table((t) => t.leaf);
const IS_LOG = u8table((t) => t.log);
const SUPPORTS = u8table((t) => t.supports);
const NEEDS_SUPPORT = u8table((t) => t.needsSupport);
const MEET = u8table((t) => t.solid || t.liquid);
const RAINSTOP = u8table((t) => t.solid || t.platform || t.liquid || t.leaf || t.stair);
const LIGHT = new Uint8Array(256), STAIR = new Uint8Array(256), TIER_OF = new Uint8Array(256), TILE_FLIP = new Uint8Array(256);
const HARD = new Float64Array(256);
for (const t of TILE) { LIGHT[t.id] = t.light; STAIR[t.id] = t.stair; TIER_OF[t.id] = Math.min(255, t.tier); HARD[t.id] = t.hard; TILE_FLIP[t.id] = t.flips; }
// rows below the world are bedrock
const tileName = (t) => (TILE[t] ? TILE[t].name : "?");
const placedForm = (t) => TILE[t].placed;
const trunkForm = (t) => TILE[t].trunk;
const isModTile = (t) => TILE[t] && TILE[t].mod;

// ===== p06_worldgen.js =====
// World generation: where the land is, how high, and which biome (the Swift game's p06_worldgen).
// Every answer depends only on the seed and the column, so chunks can be made in any order.

const Biome = { ocean: 0, plains: 1, forest: 2, desert: 3, tundra: 4, jungle: 5, savanna: 6, swamp: 7, mountain: 8, umbral: 9 };
const BIOME_NAMES = ["Ocean", "Plains", "Forest", "Desert", "Snowy Tundra", "Jungle", "Savanna", "Swamp", "Mountains", "Umbral Realm"];
const Dimension = { overworld: 0, umbral: 1, custom0: 2, custom1: 3, custom2: 4 };
const dimCount = 5;

const GEN_H = 560;          // rows in the Overworld
const GEN_SEA = 120;        // the sea's surface row
const GEN_VERSION = 6;
const FINITE_WIDTH = 4096;
const EDGE_OCEAN = 520;
const FLAT_SURFACE = GEN_SEA - 10;
const FLAT_CRUST = 16;
const RARE_CELL = 192;
const POND_CELL = 260;
const ZONE_CLIMATE = [[0.14, 0.50], [0.50, 0.33], [0.50, 0.64], [0.88, 0.14], [0.88, 0.88], [0.88, 0.50], [0.50, 0.90]];

class WorldGen {
	constructor(seed, infinite, rareChance = 0.35, genVersion = GEN_VERSION, options = null) {
		this.seed = seed >>> 0;
		this.infinite = infinite;
		this.genVersion = genVersion;
		this.options = Object.assign({ flat: false, trees: true, structures: true, caves: false, ponds: false }, options || {});
		this.width = infinite ? 2000000000 : FINITE_WIDTH;
		this.spawnX = infinite ? 0 : FINITE_WIDTH / 2;
		this.rareChance = rareChance;
		this.zones = WorldGen.makeZones(this.seed, infinite);
		this.cols = new Map();
		this.rares = new Map();
		this.ponds = new Map();
		this.portalX = 0;
		this.portalY = 0;
		const s = this.seed;
		const hs = hash2(1, 2, s);
		const dist = infinite ? 1500 + Math.floor(hs * 1800) : 300 + Math.floor(hs * 400);
		const side = hash2(3, 4, s) < 0.5 ? -1 : 1;
		let found = this.spawnX + side * dist, ok = false;
		for (let attempt = 0; attempt < 4 && !ok; attempt++) {
			const sd = attempt % 2 === 0 ? side : -side;
			const dd = attempt < 2 ? dist : (infinite ? 2400 : 520);
			for (let step = 0; step < 400 && !ok; step++) {
				const off = ((step % 2 === 0) ? 1 : -1) * Math.floor((step + 1) / 2) * 5;
				const x = this.spawnX + sd * dd + off;
				const c = this.rawCol(x, false);
				if (c.biome !== Biome.ocean && c.biome !== Biome.swamp && c.land > 0.5 && !WorldGen.lairStatic(this.spawnX, infinite, x, 230) && Math.abs(x - this.spawnX) < 3800 && Math.abs(x - this.spawnX) > 200) {
					found = x; ok = true;
				}
			}
		}
		this.portalX = found;
		this.portalY = 350 + Math.floor(hash2(5, 6, s) * 60);
	}

	get hasTrees() { return !this.options.flat || this.options.trees; }
	get hasStructures() { return !this.options.flat || this.options.structures; }
	get passableStructures() { return this.genVersion >= 3 || this.options.flat; }

	/** Finite worlds lay biome zones out in a seeded order so every biome is always there.
	 *  climate ids: 0 tundra, 1 plains, 2 forest, 3 desert, 4 jungle, 5 savanna, 6 swamp */
	static makeZones(seed, infinite) {
		if (infinite) return [];
		const pool = [0, 3, 5, 6, 1, 2];
		const extra = [0, 3, 5, 1, 2];
		pool[5] = extra[Math.floor(hash2(7, 7, seed) * 5) % 5];
		const rng = new RNG(seed + 4242);
		for (let i = pool.length - 1; i > 0; i--) { const j = rng.int(i + 1); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
		const z = new Array(9).fill(1);
		z[1] = 4;
		z[4] = hash2(8, 8, seed) < 0.5 ? 1 : 2;
		z[7] = 2;
		const slots = [0, 2, 3, 5, 6, 8];
		for (let k = 0; k < 6; k++) z[slots[k]] = pool[k];
		return z;
	}

	// ---- boss lairs: the bear's at spawn + 1000, the rex's at spawn - 1100 (every 4096 in endless worlds)
	static lairStatic(spawnX, infinite, x, radius) {
		const bases = [spawnX + 1000, spawnX - 1100];
		for (let i = 0; i < 2; i++) {
			const base = bases[i];
			let k = Math.round((x - base) / 4096);
			if (!infinite) k = 0;
			const cx = base + k * 4096;
			if (Math.abs(x - cx) < radius) return { kind: i, cx, k };
		}
		return null;
	}
	lairAt(x, radius = 150) { return this.hasStructures ? WorldGen.lairStatic(this.spawnX, this.infinite, x, radius) : null; }
	static lairCentersStatic(spawnX, infinite, x) {
		const out = [];
		for (const base of [spawnX + 1000, spawnX - 1100]) {
			if (!infinite) { out.push(base); continue; }
			const k = Math.round((x - base) / 4096);
			for (let kk = k - 1; kk <= k + 1; kk++) out.push(base + kk * 4096);
		}
		return out;
	}

	// ---- climate and terrain
	static zoneCoord(width, count, x) {
		const zw = (width - 2 * EDGE_OCEAN) / count;
		return (x - EDGE_OCEAN) / zw - 0.5;
	}
	climate(x) {
		const s = this.seed;
		let temp = fbm1(x / 700, s + 11, 2), humid = fbm1(x / 520, s + 12, 2);
		const zones = this.zones;
		if (this.infinite || zones.length < 2) return [0.5 + (temp - 0.5) * 1.3, 0.5 + (humid - 0.5) * 1.3];
		const t = clampD(WorldGen.zoneCoord(this.width, zones.length, x), 0, zones.length - 1 - 0.0001);
		const i = Math.floor(t), f = t - i;
		const sm = smooth(clampD((f - 0.3) / 0.4, 0, 1));
		const a = ZONE_CLIMATE[zones[i]], b = ZONE_CLIMATE[zones[i + 1]];
		return [lerpD(a[0], b[0], sm) + (temp - 0.5) * 0.30, lerpD(a[1], b[1], sm) + (humid - 0.5) * 0.30];
	}
	/** 0...1 bump marking a mountain range centred somewhere near x */
	rangeBump(x) {
		const s = this.seed;
		let best = 0;
		if (this.infinite) {
			const cellW = 1100, c0 = floorDiv(x, cellW);
			for (let c = c0 - 1; c <= c0 + 1; c++) {
				if (hash2(c, 302, s) > 0.52) continue;
				const cen = c * cellW + 200 + Math.floor(hash2(c, 303, s) * 700);
				const hw = 130 + hash2(c, 304, s) * 110;
				best = Math.max(best, smooth(clampD(1 - Math.abs(x - cen) / hw, 0, 1)));
			}
		} else {
			const zw = (this.width - 2 * EDGE_OCEAN) / 9;
			const ka = 2 + Math.floor(hash2(1, 305, s) * 2), kb = 6 + Math.floor(hash2(2, 305, s) * 2);
			const cs = [EDGE_OCEAN + zw * ka + (hash2(1, 307, s) - 0.5) * 80, EDGE_OCEAN + zw * kb + (hash2(2, 307, s) - 0.5) * 80];
			for (let k = 0; k < 2; k++) {
				const hw = 160 + hash2(k, 306, s) * 70;
				best = Math.max(best, smooth(clampD(1 - Math.abs(x - cs[k]) / hw, 0, 1)));
			}
		}
		return best;
	}
	/** The sea every world has near its spawn, on a seeded side */
	homeBasin(small) {
		const s = this.seed;
		const side = hash2(41, 42, s) < 0.5 ? -1 : 1;
		const off = 560 + Math.floor(hash2(43, 44, s) * 120);
		if (small) return { center: this.spawnX + side * off, halfW: 112 + Math.floor(hash2(45, 46, s) * 38), ramp: 90 };
		return { center: this.spawnX + side * off, halfW: 150 + Math.floor(hash2(45, 46, s) * 50), ramp: 110 };
	}
	cellBasin(c, small) {
		const s = this.seed;
		if (hash2(c, 401, s) > 0.26) return null;
		const cellW = 1600;
		let hw = 140 + Math.floor(hash2(c, 402, s) * 220);
		const cen = c * cellW + hw + 140 + Math.floor(hash2(c, 403, s) * Math.max(1, cellW - 2 * hw - 280));
		if (Math.abs(cen - this.spawnX) < hw + 900) return null;
		for (const lc of WorldGen.lairCentersStatic(this.spawnX, true, cen)) if (Math.abs(cen - lc) < hw + 330) return null;
		if (small) return { center: cen, halfW: Math.trunc(hw * 3 / 4), ramp: 105 };
		return { center: cen, halfW: hw, ramp: 140 };
	}
	/** 0...1: how strongly x lies inside an ocean basin */
	oceanBasin(x, small) {
		const weight = (b) => 1 - smooth(clampD((Math.abs(x - b.center) - b.halfW) / b.ramp, 0, 1));
		let w = weight(this.homeBasin(small));
		if (this.infinite) {
			const c0 = floorDiv(x, 1600);
			for (let c = c0 - 1; c <= c0 + 1; c++) { const b = this.cellBasin(c, small); if (b) w = Math.max(w, weight(b)); }
		}
		return w;
	}
	biomeFromClimate(temp, humid) {
		const tundra = smooth(clampD((0.31 - temp) / 0.06, 0, 1));
		const hot = smooth(clampD((temp - 0.64) / 0.06, 0, 1));
		const desert = hot * smooth(clampD((0.42 - humid) / 0.06, 0, 1));
		const jungle = hot * smooth(clampD((humid - 0.58) / 0.06, 0, 1));
		const savanna = hot * (1 - desert) * (1 - jungle);
		const swamp = smooth(clampD((humid - 0.68) / 0.06, 0, 1)) * (1 - tundra) * (1 - hot);
		let biome = humid > 0.5 ? Biome.forest : Biome.plains;
		if (tundra > 0.5) biome = Biome.tundra;
		else if (desert > 0.5) biome = Biome.desert;
		else if (jungle > 0.5) biome = Biome.jungle;
		else if (savanna > 0.5) biome = Biome.savanna;
		else if (swamp > 0.5) biome = Biome.swamp;
		return { biome, tundra, hot, desert, jungle, savanna, swamp };
	}
	/** One column, worked out afresh (see colBase for the remembered one) */
	rawCol(x, lairs = true) {
		if (this.options.flat) {
			const cl = this.climate(x);
			const b = this.biomeFromClimate(cl[0], cl[1]);
			let biome = b.biome;
			if (lairs && this.hasStructures) { const L = WorldGen.lairStatic(this.spawnX, this.infinite, x, 150); if (L && Math.abs(x - L.cx) < 120) biome = L.kind === 0 ? Biome.forest : Biome.jungle; }
			return { h: FLAT_SURFACE, biome, land: 0.7, mtn: 0, swamp: 0 };
		}
		const s = this.seed, sea = GEN_SEA, H = GEN_H, infinite = this.infinite, width = this.width;
		const smallSeas = this.genVersion >= 6;
		let land = fbm1(x / (smallSeas ? 700 : 800), s + 1, 3);
		if (!infinite) {
			const e = Math.min(x, width - 1 - x);
			if (e < EDGE_OCEAN) land *= smooth(clampD(e / EDGE_OCEAN, 0, 1));
			if (x < 0 || x >= width) land = 0;
			if (this.zones.length > 1 && e > EDGE_OCEAN * 0.55) {
				// some dry land in the middle of every biome zone
				const zc = WorldGen.zoneCoord(width, this.zones.length, x) + 0.5;
				const fr = Math.abs(zc - Math.floor(zc) - 0.5);
				const wgt = 1 - smooth(clampD((fr - 0.2) / 0.2, 0, 1));
				land = lerpD(land, Math.max(land, 0.62), wgt);
			}
		}
		const ds = Math.abs(x - this.spawnX);
		if (ds < 320) land = lerpD(land, Math.max(land, 0.64), Math.min(1, (1 - ds / 320) * 1.6));
		let lw = 0, forced = -1;
		const L = WorldGen.lairStatic(this.spawnX, infinite, x, 150);
		if (L) {
			const d = Math.abs(x - L.cx);
			lw = 1 - smooth(clampD((d - 60) / 90, 0, 1));
			land = Math.max(land, lerpD(land, 0.65, lw));
			if (d < 120) forced = L.kind === 0 ? Biome.forest : Biome.jungle;
		}
		if (smallSeas && land < 0.50 && land > 0.25) land += 0.06 * (1 - smooth(clampD(Math.abs(land - 0.40) / 0.09, 0, 1)));
		const basin = this.genVersion >= 2 ? this.oceanBasin(x, smallSeas) : 0;
		if (basin > 0) land = Math.min(land, lerpD(land, 0.17, basin));
		const mraw = Math.max(fbm1(x / 420, s + 3, 2) - 0.08, 0.56 + 0.40 * this.rangeBump(x));
		let mtn = smooth(clampD((mraw - 0.60) / 0.16, 0, 1)) * clampD((land - 0.45) / 0.1, 0, 1);
		mtn *= clampD((ds - 170) / 130, 0, 1);
		if (lw > 0) mtn *= (1 - lw);
		const cl = this.climate(x);
		const b = this.biomeFromClimate(cl[0], cl[1]);
		let swamp = b.swamp;
		if (lw > 0) swamp *= (1 - lw);
		let biome = b.biome;
		if (biome === Biome.swamp && swamp <= 0.5) biome = cl[1] > 0.5 ? Biome.forest : Biome.plains;
		if (mtn > 0.35) biome = Biome.mountain;
		if (land < 0.40) biome = Biome.ocean;
		if (forced >= 0) biome = forced;
		const amp = Math.max(0.12, 1 - 0.4 * b.tundra - 0.3 * b.desert - 0.5 * b.savanna - 0.88 * swamp + 0.15 * b.jungle);
		let h;
		if (land >= 0.40) {
			const t = clampD((land - 0.40) / 0.25, 0, 1);
			h = sea - 2 - t * 12;
			const hills = (fbm1(x / 55, s + 2, 3) - 0.5) * 2 * 15 * amp;
			const bumps = (noise1(x / 9, s + 8) - 0.5) * 3 * amp;
			h -= hills + bumps;
			const v = fbm1(x / 140, s + 5, 2);
			if (v < 0.36) h += (0.36 - v) / 0.36 * 16 * Math.min(1, amp);
			const cliff = noise1(x / 95, s + 6);
			if (cliff > 0.72) h -= 10 * smooth(clampD((cliff - 0.72) / 0.015, 0, 1));
			const peak = fbm1(x / 70, s + 4, 4);
			h -= mtn * (14 + peak * 70);
			if (swamp > 0) h = lerpD(h, sea + (noise1(x / 14, s + 9) - 0.55) * 5, swamp);
		} else {
			const d = clampD((0.40 - land) / 0.14, 0, 1);
			h = sea - 2 + d * 48 + (noise1(x / 7, s + 10) - 0.5) * 3 * d;
		}
		if (lw > 0) h = lerpD(h, sea - 10, lw);
		return { h: clampI(Math.round(h), 14, H - 80), biome, land, mtn, swamp };
	}
	colBase(x) {
		let c = this.cols.get(x);
		if (c) return c;
		c = this.rawCol(x, true);
		if (this.cols.size > 24000) this.cols.clear();
		this.cols.set(x, c);
		return c;
	}
	/** (generator 6 has no villages, so a column is its base) */
	col(x) { return this.colBase(x); }

	// ---- rare sites (ruins): where they are; what they are built of comes in a later phase
	rareSite(c) {
		if (this.rares.has(c)) return this.rares.get(c);
		const r = this.computeRareSite(c);
		if (this.rares.size > 8000) this.rares.clear();
		this.rares.set(c, r);
		return r;
	}
	computeRareSite(c) {
		if (!this.hasStructures) return null;
		const s = this.seed;
		if (hash2(c, 71, s) > this.rareChance) return null;
		const sx = c * RARE_CELL + 32 + Math.floor(hash2(c, 72, s) * (RARE_CELL - 64));
		const base = this.colBase(sx);
		if (base.biome === Biome.ocean || base.land < 0.45) return null;
		if (this.lairAt(sx, 260)) return null;
		if (Math.abs(sx - this.portalX) < 90) return null;
		if (!this.infinite && (sx < 300 || sx > this.width - 300)) return null;
		if (this.options.flat && Math.abs(sx - this.spawnX) < 48) return null;
		const r = hash2(c, 73, s);
		const kind = r < 0.17 ? 0 : r < 0.34 ? 1 : r < 0.51 ? 2 : r < 0.68 ? 3 : r < 0.84 ? 4 : 5; // house, tower, fort, camp, overgrown, bunker
		return { cell: c, x: sx, kind, seed: hashU(c, 74, s) };
	}
	rareSites(x0, x1) {
		const out = [];
		for (let c = floorDiv(x0 - 40, RARE_CELL); c <= floorDiv(x1 + 40, RARE_CELL); c++) {
			const s = this.rareSite(c);
			if (s && s.x + 30 >= x0 && s.x - 30 <= x1) out.push(s);
		}
		return out;
	}

	// ---- ponds (flat worlds)
	pondSite(c) {
		if (this.ponds.has(c)) return this.ponds.get(c);
		let p = null;
		const o = this.options, s = this.seed;
		if (o.flat && o.ponds && hash2(c, 501, s) <= 0.5) {
			const cx = c * POND_CELL + 50 + Math.floor(hash2(c, 502, s) * (POND_CELL - 100));
			const hw = 4 + Math.floor(hash2(c, 503, s) * 6);
			const depth = hash2(c, 504, s) < 0.4 ? 3 : 2;
			let ok = true;
			if (!this.infinite && (cx - hw < 40 || cx + hw > this.width - 40)) ok = false;
			if (Math.abs(cx - this.spawnX) < hw + 24 || Math.abs(cx - this.portalX) < hw + 16) ok = false;
			if (this.lairAt(cx, hw + 60)) ok = false;
			for (const r of this.rareSites(cx - hw - 40, cx + hw + 40)) if (Math.abs(r.x - cx) < hw + 40) ok = false;
			if (ok) p = { cx, halfW: hw, depth };
		}
		this.ponds.set(c, p);
		return p;
	}
	pondDepth(x) {
		if (!this.options.flat || !this.options.ponds) return 0;
		const c = floorDiv(x, POND_CELL);
		for (let cc = c - 1; cc <= c + 1; cc++) {
			const p = this.pondSite(cc);
			if (!p) continue;
			const dx = Math.abs(x - p.cx);
			if (dx > p.halfW) continue;
			const f = dx / (p.halfW + 0.5);
			return clampI(Math.ceil(p.depth * Math.sqrt(Math.max(0, 1 - f * f))), 1, p.depth);
		}
		return 0;
	}
	nearPond(x, pad) {
		if (!this.options.flat || !this.options.ponds) return false;
		const c = floorDiv(x, POND_CELL);
		for (let cc = c - 1; cc <= c + 1; cc++) { const p = this.pondSite(cc); if (p && Math.abs(x - p.cx) <= p.halfW + pad) return true; }
		return false;
	}

	// ---- caves, ores and trees (the Swift game's p07_chunk rules)
	get oreTable() { return this.genVersion >= 6 ? ORE_RULES_6 : ORE_RULES; }
	rockAt(x, y) {
		const hy = hash2(x, Math.trunc(y / 3), this.seed + 5);
		const by = y + Math.trunc((hy - 0.5) * 12);
		return by < 300 ? T.stone : by < 430 ? T.slate : T.deepRock;
	}
	isCave(x, y, depth) {
		if (depth < 5) return false;
		const s = this.seed;
		// winding tunnels follow the 0.5 contour of a smooth noise field
		if (vnoise(x * 0.013, y * 0.013, s + 25) > 0.34) {
			const a = vnoise(x * 0.045, y * 0.06, s + 21);
			const w = 0.030 + 0.05 * vnoise(x * 0.02, y * 0.02, s + 22);
			if (Math.abs(a - 0.5) < w) return true;
		}
		// big chambers
		if (depth > 26) {
			const c = vnoise(x * 0.03, y * 0.045, s + 23) * 0.65 + vnoise(x * 0.085, y * 0.1, s + 24) * 0.35;
			const bonus = Math.min(0.05, Math.max(0, y - 150) * 0.00015);
			if (c > 0.715 - bonus) return true;
		}
		// surface shafts: a few cave mouths
		if (depth < 40) {
			if (noise1(x / 18, s + 26) > 0.90 && vnoise(x * 0.2, y * 0.2, s + 27) > 0.35) return true;
		}
		return false;
	}
	oreAt(x, y, biome, regionOK) {
		const s = this.seed, rules = this.oreTable;
		for (let k = 0; k < rules.length; k++) {
			const r = rules[k];
			if (y < r.minY || y > r.maxY) continue;
			if (r.region > 0 && !regionOK[k]) continue;
			if (vnoise(x * 0.22, y * 0.22, s + r.salt) + oreBias(biome, r.tile) > r.thr) {
				if (hash2(x, y, s + 40 + r.salt) < r.p) return r.tile;
			}
		}
		return -1;
	}

// ===== p07_chunk.js =====
// Chunks: 16 columns of the world, and how the Overworld's are made (the Swift game's p07_chunk).

const chunkW = 16;
let chunkSerial = 0;

class Chunk {
	constructor(cx, H) {
		this.serial = ++chunkSerial;
		this.cx = cx;
		this.H = H;
		this.x0 = cx * chunkW;
		/** tiles by column: tiles[lx * H + y] */
		this.tiles = new Uint8Array(chunkW * H);
		/** per column: the first row sky light does not reach */
		this.skyTop = new Int32Array(chunkW);
		this.surf = new Int32Array(chunkW);
		this.ceilY = new Int32Array(chunkW);

		this.hasSky = true;
		this.rev = 0;

		this.walls = null;
		this.back = null;

		this.level = null;

	put(x, y, t) {

	}
	putIfAir(x, y, t) {
		const lx = x - this.x0;
		if (lx < 0 || lx >= chunkW || y < 1 || y >= this.H - 1) return;
		if (this.tiles[lx * this.H + y] === T.air) this.tiles[lx * this.H + y] = t;
	}
	at(x, y) {

	}

		if (!this.walls) this.walls = new Uint8Array(chunkW * this.H);

		if (!this.hasSky) { this.skyTop[lx] = this.H; return; }

/** Fills out[y - y0] with vnoise(fx, y * fyScale, seed) for y in y0...y1, hashing each lattice row once */
function columnNoise(seed, fx, fyScale, y0, y1, out) {
	if (y1 < y0) return;
	const fx0 = Math.floor(fx);
	const fu = fx - fx0;
	const u = fu * fu * (3 - 2 * fu);
	let rowI = -1e9, a = 0, b = 0, c = 0, d = 0, top = 0, bot = 0;
	for (let y = y0, k = 0; y <= y1; y++, k++) {
		const fy = y * fyScale;
		const yi = Math.floor(fy);
		if (yi !== rowI) {
			if (yi === rowI + 1) { a = c; b = d; } else { a = hash2(fx0, yi, seed); b = hash2(fx0 + 1, yi, seed); }
			c = hash2(fx0, yi + 1, seed); d = hash2(fx0 + 1, yi + 1, seed);
			top = a + (b - a) * u; bot = c + (d - c) * u;
			rowI = yi;
		}
		const f = fy - yi;
		out[k] = top + (bot - top) * (f * f * (3 - 2 * f));
	}
}

/** Cave, ore and rock sampling a column at a time: startColumn works out every noise field the column

class GenSampler {
	constructor(g) {

		this.cham = new Float64Array(H); this.shaft = new Float64Array(H); this.scratch = new Float64Array(H);

	}

			columnNoise(s + 21, cx * 0.045, 0.06, this.top, y1, this.tunnel);
			columnNoise(s + 22, cx * 0.02, 0.02, this.top, y1, this.width);
			if (this.chamTop <= y1) {
				columnNoise(s + 23, cx * 0.03, 0.045, this.chamTop, y1, this.cham);
				columnNoise(s + 24, cx * 0.085, 0.1, this.chamTop, y1, this.scratch);
				for (let k = 0, n = y1 - this.chamTop + 1; k < n; k++) this.cham[k] = this.cham[k] * 0.65 + this.scratch[k] * 0.35;
			}
			if (this.shaftN > 0.90) columnNoise(s + 27, cx * 0.2, 0.2, this.top, Math.min(y1, h + 39), this.shaft);
		}
		for (let k = 0; k < this.rules.length; k++) {
			const r = this.rules[k];
			const lo = Math.max(r.minY, h + 9);
			let hi = Math.min(r.maxY, H - 6);
			if (r.region > 0 && oreRegion(cx, r.salt, s) < r.region) hi = lo - 1;
			this.oreLo[k] = lo; this.oreHi[k] = hi;

		if (depth < 5 || y < this.top) return false;
		const i = y - this.top;

		}
		if (depth > 26 && y >= this.chamTop) {
			const bonus = Math.min(0.05, Math.max(0, y - 150) * 0.00015);
			if (this.cham[y - this.chamTop] > 0.715 - bonus) return true;

			if (y >= lo && y <= this.oreHi[k] && this.ores[k][y - lo] > this.oreThr[k]) {

/** One column of a standard world: the biome's surface and topsoil, sea water above low ground, rock
 *  layers, caves (with underground lakes and deep lava) and ores */
function fillStandardColumn(ch, g, samp, lx, x, h, sb, biome) {
	const H = GEN_H, sea = GEN_SEA, base = lx * H, B = Biome, tiles = ch.tiles, s = g.seed;
	let topT = T.grass, fillT = T.dirt, fillD = 5;
	switch (sb) {
		case B.desert: topT = T.sand; fillT = T.sand; fillD = 9; break;
		case B.tundra: topT = T.snow; fillT = T.snow; fillD = 3; break;
		case B.jungle: topT = T.jungleGrass; fillT = T.mud; fillD = 7; break;
		case B.savanna: topT = T.dryGrass; fillD = 4; break;
		case B.swamp: topT = T.mossGrass; fillT = T.mud; fillD = 6; break;
		case B.ocean: topT = T.sand; fillT = T.sand; fillD = 5; break;
		case B.mountain:
			if (h <= 72) { topT = T.snow; fillT = T.snow; fillD = 3; }
			else if (h <= 100) { topT = T.stone; fillT = T.stone; fillD = 4; }
			break;
	}
	if (sb !== B.ocean && sb !== B.swamp && sb !== B.desert && h >= sea - 1 && h <= sea + 2) { topT = T.sand; fillT = T.sand; fillD = 4; }
	if (h > sea) for (let y = sea; y < h; y++) tiles[base + y] = (sb === B.tundra && y === sea) ? T.ice : T.water;
	const lakeCol = Math.trunc(x / 60);
	for (let y = h; y < H; y++) {
		const depth = y - h;
		let t;
		if (y >= H - 1) t = T.bedrock;
		else if (y >= H - 5 && hash2(x, y, s + 3) < (y - (H - 6)) * 0.22) t = T.bedrock;
		else if (depth === 0) t = topT;
		else if (depth < fillD) t = (sb === B.tundra && depth >= 3) ? T.dirt : fillT;
		else if (sb === B.desert && depth < 24) t = T.sandstone;
		else t = samp.rockAt(x, y);
		if (depth >= 4 && y < H - 5) {
			if (samp.isCave(x, y, depth)) {
				if (y >= 500) t = T.lava;
				else if (y > 200 && y < 430 && hash2(lakeCol, Math.trunc(y / 48), s + 28) < 0.28 && (y % 48) > 28) t = T.water;
				else t = T.air;
			} else if (depth > 8 && t !== T.sand && t !== T.snow) {
				const o = samp.oreAt(x, y, biome);
				if (o >= 0) t = o;
			}

		tiles[base + y] = t;
	}
}

/** One column of a flat world: the same layers everywhere */
function fillFlatColumn(ch, g, samp, lx, x, h, surfBiome, biome) {
	const H = GEN_H, B = Biome, base = lx * H, s = g.seed;
	let topT = T.grass, fillT = T.dirt;
	switch (surfBiome) {
		case B.desert: topT = T.sand; fillT = T.sand; break;
		case B.tundra: topT = T.snow; break;
		case B.jungle: topT = T.jungleGrass; fillT = T.mud; break;
		case B.savanna: topT = T.dryGrass; break;
		case B.swamp: topT = T.mossGrass; fillT = T.mud; break;
	}
	const pond = g.pondDepth(x);
	if (pond === 0 && g.nearPond(x, 1)) topT = T.sand;
	const caves = g.options.caves;
	for (let y = h; y < H; y++) {
		const depth = y - h;
		let t;
		if (y >= H - 3) t = T.bedrock;
		else if (depth < pond) t = (surfBiome === B.tundra && depth === 0) ? T.ice : T.water;
		else if (depth === pond && pond > 0) t = T.sand;
		else if (depth === 0) t = topT;
		else if (depth <= 4) t = fillT;
		else if (y < 300) t = T.stone;
		else if (y < 430) t = T.slate;
		else t = T.deepRock;
		if (y < H - 5 && depth >= FLAT_CRUST && caves && samp.isCave(x, y, depth)) {
			if (y >= 500) t = T.lava;
			else if (y > 200 && y < 430 && hash2(Math.trunc(x / 60), Math.trunc(y / 48), s + 28) < 0.28 && (y % 48) > 28) t = T.water;
			else t = T.air;
		} else if (depth > 8 && y < H - 5) {
			const o = samp.oreAt(x, y, biome);
			if (o >= 0) t = o;
		}

	const cols = [];
	for (let x = x0 - m; x < x0 + chunkW + m; x++) cols.push(g.col(x));
	const colAt = (x) => cols[x - (x0 - m)];

			const below = ch.tiles[base + y + 1], above = ch.tiles[base + y - 1];
			if (SOLID[below] && below !== T.bedrock && y > 190 && y < 470 && hash2(x, y, s + 81) < 0.025) ch.tiles[base + y] = T.mushroom;
			else if (SOLID[above] && hash2(x, y, s + 82) < 0.012) ch.tiles[base + y] = T.cobweb;
		}

	// surface plants and trees
	const rares = g.rareSites(x0 - 30, x0 + chunkW + 30);
	const blocked = (x) => {
		for (const r of rares) if (Math.abs(x - r.x) < 16) return true;
		if (g.lairAt(x, 110)) return true;

				} else if (sb === B.jungle && surf === T.jungleGrass) {
					if (r < 0.30) ch.setLocal(lx, gy, T.tallGrass); else if (r < 0.34) ch.setLocal(lx, gy, T.flowerR);
				} else if (sb === B.savanna && surf === T.dryGrass) {

				} else if (sb === B.swamp && surf === T.mossGrass) {
					if (r < 0.14) ch.setLocal(lx, gy, T.reed); else if (r < 0.17) ch.setLocal(lx, gy, T.mushroom);

		let merged = 0;
		for (let i = 0; i < this.slots.length; i++) {
			const a = this.slots[i];
			if (!a) continue;
			const ms = maxStack(a.id);
			if (ms <= 1 || a.n >= ms) continue;
			for (let j = i + 1; j < this.slots.length && a.n < ms; j++) {
				const b = this.slots[j];
				if (!b || b.id !== a.id || b.extra !== a.extra || !sameInf(b.inf, a.inf)) continue;
				const put = Math.min(ms - a.n, b.n);
				a.n += put; b.n -= put;
				if (b.n <= 0) this.slots[j] = null;
				merged++;
			}
		}
		return merged;
	}
	/** sorts the bag (everything past the hotbar): equal stacks merge, then by kind and name */
	sortBag() {
		const list = [];
		for (let i = HOTBAR_N; i < this.slots.length; i++) {
			const s = this.slots[i];
			if (!s) continue;
			this.slots[i] = null;
			const ms = maxStack(s.id);
			const j = ms > 1 ? list.findIndex((o) => o.id === s.id && o.extra === s.extra && sameInf(o.inf, s.inf) && o.n < ms) : -1;
			if (j >= 0) {
				const put = Math.min(ms - list[j].n, s.n);
				list[j].n += put;
				if (s.n - put > 0) list.push(stack(s.id, s.n - put, s.extra, s.inf));
			} else list.push(s);
		}
		list.sort((a, b) => {
			const ka = itemDef(a.id).sortGroup, kb = itemDef(b.id).sortGroup;
			if (ka !== kb) return ka - kb;
			const na = itemName(a.id), nb = itemName(b.id);
			if (na !== nb) return na < nb ? -1 : 1;
			return b.n - a.n;
		});
		list.forEach((s, k) => { if (HOTBAR_N + k < this.slots.length) this.slots[HOTBAR_N + k] = s; });
	}
	/** total armour defence */
	get defense() {
		let d = 0;
		for (const s of this.armor) if (s && s.id.startsWith("armor:")) d += itemDef(s.id).defense || 0;
		return d;
	}
	wearing(gear) { for (let i = FIRST_GEAR; i < this.armor.length; i++) { const s = this.armor[i]; if (s && s.id === "gear:" + gear) return true; } return false; }
	toJSON() { return { slots: this.slots, armor: this.armor }; }
	static from(o) {
		const v = new Inventory();
		if (o && o.slots) o.slots.forEach((s, i) => { if (i < BAG_N) v.slots[i] = s ? stack(s.id, s.n, s.extra || 0, s.inf || null) : null; });
		if (o && o.armor) o.armor.forEach((s, i) => { if (i < ARMOR_N) v.armor[i] = s ? stack(s.id, s.n, s.extra || 0, s.inf || null) : null; });
		return v;
	}
}

function tileDropStacks(t, x, y, game) {
	const out = [];

	switch (t) {
		case T.tallGrass: if (r < 0.14) out.push(stack("mat:seeds", 1)); break;
		case T.leaves: case T.jungleLeaves: case T.birchLeaves: case T.pineLeaves:
			if ((t === T.leaves || t === T.jungleLeaves) && r < 0.05) out.push(stack("food:apple", 1));
			if (Math.random() < 0.085) out.push(stack("block:sapling", 1));
			break;
		case T.wheat3: out.push(stack("food:wheat", 1 + randInt(0, 1))); out.push(stack("mat:seeds", 1 + randInt(0, 2))); break;
		case T.wheat1: case T.wheat2: out.push(stack("mat:seeds", 1)); break;
		case T.carrot3: out.push(stack("food:carrot", 1 + randInt(0, 2))); break;
		case T.carrot1: case T.carrot2: out.push(stack("food:carrot", 1)); break;
		case T.cobweb: out.push(stack("mat:string", 1)); break;
		case T.saltpeter: out.push(stack("mat:saltpeter", 1 + (r < 0.35 ? 1 : 0))); break;
		case T.amethyst: out.push(stack("mat:amethyst", 1 + (r < 0.5 ? 1 : 0))); break;
		case T.chest: for (const s of game.world.removeChest(x, y)) out.push(s); out.push(stack("block:chest", 1)); break;

const ORE_TILES = new Set([T.coal, T.copper, T.iron, T.gold, T.diamond, T.mythril, T.emberOre, T.voidOre, T.tin, T.silver, T.saltpeter, T.amethyst, T.crystalOre]);

// ---- chest loot: decided by a chest's place, the first time it is opened (the Swift game's
// generateChestLoot, without the structures that are not ported yet)
function generateChestLoot(g, dim, x, y) {
	const rng = new RNG(hashU(x, y, g.seed + 777));
	const out = [];
	const add = (id, lo, hi, p) => { if (rng.double() < p) out.push(stack(id, lo + rng.int(Math.max(1, hi - lo + 1)))); };
	const tierPick = (lo, hi) => TIERS[clampI(lo + rng.int(Math.max(1, hi - lo + 1)), 1, 9) - 1].key;
	const slots = ["head", "chest", "legs"];
	if (dim === Dimension.umbral) {
		add("mat:emberBar", 2, 6, 0.8); add("mat:voidBar", 1, 3, 0.35); add("mat:diamond", 1, 4, 0.6);
		add("ammo:arrow", 15, 40, 0.5); add("ammo:bullet", 8, 20, 0.5); add("sword:" + tierPick(6, 8), 1, 1, 0.35);
		add("armor:" + slots[rng.int(3)] + ":" + tierPick(6, 8), 1, 1, 0.3); add("food:cookedMeat", 3, 6, 0.6); add("block:lantern", 2, 4, 0.5);
		return out;
	}
	if (Math.abs(x - g.portalX) < 20 && y > 300) {
		add("mat:diamond", 3, 7, 1); add("mat:mythrilBar", 2, 5, 0.9); add("mat:goldBar", 4, 9, 0.8); add("gun:rifle", 1, 1, 0.5); add("ammo:bullet", 12, 30, 0.9); add("food:cookedMeat", 4, 8, 0.8);
		return out;
	}
	const L = g.lairAt(x, 70);
	if (L && y < 200) {
		add("mat:goldBar", 3, 8, 0.9); add("mat:diamond", 1, 3, 0.6); add("sword:" + tierPick(4, 6), 1, 1, 0.5);
		add("armor:" + slots[rng.int(3)] + ":" + tierPick(4, 6), 1, 1, 0.5);
		if (L.kind === 0) { add("mat:fur", 2, 5, 0.9); add("mat:claw", 1, 3, 0.7); } else { add("mat:tusk", 1, 2, 0.5); add("mat:bone", 6, 14, 1); }
		add("food:cookedMeat", 3, 6, 0.8);
		return out;
	}
	const special = chestLootHook(g, dim, x, y, rng, add, tierPick);
	if (special) return special;
	if (y < GEN_SEA + 40) {
		add("block:planks", 6, 14, 0.8); add("food:bread", 1, 3, 0.6); add("block:torch", 3, 8, 0.7); add("mat:copperBar", 1, 4, 0.5);
		if (g.genVersion >= 3) add("mat:relicFragment", 1, 1, 0.15);
	} else if (y < 320) {
		add("mat:ironBar", 2, 6, 0.8); add("mat:goldBar", 1, 4, 0.5); add("block:torch", 6, 14, 0.8); add("tool:pickaxe:" + tierPick(3, 5), 1, 1, 0.25);
		add("ammo:arrow", 10, 24, 0.5); add("food:cookedMeat", 2, 4, 0.6);
	} else {
		add("mat:goldBar", 3, 8, 0.8); add("mat:diamond", 1, 4, 0.55); add("mat:mythrilBar", 1, 3, 0.4); add("sword:" + tierPick(5, 7), 1, 1, 0.3);
		add("ammo:bullet", 8, 20, 0.45); add("block:lantern", 2, 5, 0.6);
	}
	if (!out.length) add("block:torch", 3, 6, 1);
	return out;
}
/** loot of structures added by later phases (ruins, mines, grottos); null when none applies */
function chestLootHook(g, dim, x, y, rng, add, tierPick) { return null; }

Object.assign(World.prototype, {
	chestKey(x, y) { return this.dim + ":" + x + ":" + y; },
	chestItems(x, y) {
		const k = this.chestKey(x, y);

});

// ===== p24_painter.js =====
// The land painter: one 16x16-block section of a chunk as a 256x256 picture (the Swift game's
// p24_painter). Solid ground gets a lit top edge and dark lines where it meets open space, blocks are
// mirrored from place to place where their art allows it, and leaves grow tufts into the open air.
// Pixels are 32-bit little-endian RGBA: 0xAABBGGRR.

const TPX = 16;            // art pixels a block
const TT = TPX * TPX;
const SEC_PX = chunkW * TPX;

function shade32(c, f) {
	let r = (c & 255) * f, g = ((c >>> 8) & 255) * f, b = ((c >>> 16) & 255) * f;
	if (r > 255) r = 255; if (g > 255) g = 255; if (b > 255) b = 255;
	return (0xFF000000 | (b << 16) | (g << 8) | r) >>> 0;
}
function mix32(under, over, f) {
	const ch = (s) => { const a = (under >>> s) & 255, b = (over >>> s) & 255; return Math.floor(a + (b - a) * f); };
	return (0xFF000000 | (ch(16) << 16) | (ch(8) << 8) | ch(0)) >>> 0;
}
const lum32 = (c) => (c & 255) * 0.299 + ((c >>> 8) & 255) * 0.587 + ((c >>> 16) & 255) * 0.114;

const LeafTufts = {
	up: ["....L........L..", "...LgL.....LLgL.", "..LgggL...Lgggs.", ".LggggsL.Lggggs."],
	down: [".sggggs..sgggs..", "..sggs....sgs...", "...ss......s....", "................"],
	left: ["....", "...L", "..Lg", ".Lgg", "..sg", "...s", "....", "....", "....", "..Lg", ".Lgg", ".sgg", "..ss", "....", "....", "...."],
	right: ["....", "L...", "gL..", "ggs.", "gs..", "s...", "....", "....", "....", "gL..", "ggL.", "ggs.", "ss..", "....", "....", "...."],
	/** the four tones of a leaf block's picture, light to dark */
	tones(px, base) {
		const seen = [];
		for (let i = 0; i < TT; i++) { const c = px[base + i]; if ((c >>> 24) !== 0) { const rgb = (c | 0xFF000000) >>> 0; if (!seen.includes(rgb)) seen.push(rgb); } }
		if (!seen.length) return [0xFF4A9A6A, 0xFF3A7A4C, 0xFF305E3A, 0xFF264428];
		seen.sort((a, b) => lum32(b) - lum32(a));
		const n = seen.length;
		return [seen[0], seen[Math.min(n - 1, Math.floor(n / 3))], seen[Math.min(n - 1, Math.floor(2 * n / 3))], seen[n - 1]];
	},
	/** a leaf block's tufts: for each side (0 up, 1 down, 2 left, 3 right) two versions, as flat lists
	 *  of (place in the cell, colour) */
	make(tn) {
		const ink = { L: tn[0], g: tn[1], s: tn[2], d: tn[3] };
		const cells = (rows, ox, oy, mirror, shift) => {
			const out = [];
			const w = rows[0].length;
			rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const c = ink[row[x]]; if (c === undefined) continue; out.push(((oy + y + shift) % TPX) * TPX + ox + (mirror ? w - 1 - x : x), c); } });
			return out;
		};
		const top = TPX - this.up.length, side = TPX - 4;
		return [
			[cells(this.up, 0, top, false, 0), cells(this.up, 0, top, true, 0)],
			[cells(this.down, 0, 0, false, 0), cells(this.down, 0, 0, true, 0)],
			[cells(this.left, side, 0, false, 0), cells(this.left, side, 0, false, TPX / 2)],
			[cells(this.right, 0, 0, false, 0), cells(this.right, 0, 0, false, TPX / 2)],
		];
	},
};

const Painter = {
	/** art of every tile by number: 256 pixels each */
	tilePx: new Uint32Array(256 * TT),
	/** 0 fully clear, 1 fully solid, 2 partly see-through */
	tileKind: new Uint8Array(256),
	/** wall pictures by wall value - 1 (1-7 the old kinds, 8 + n a wall of tile n) */
	wallPx: new Uint32Array((blockWallBase - 1 + 256) * TT),
	wallCount: blockWallBase - 1 + NT,
	tufts: new Map(),
	leafTones: new Map(),
	buf: new Uint32Array(SEC_PX * SEC_PX),

	/** reads every tile's and wall's art out of the atlas (again after the art is edited) */
	init() {
		const a = Atlas.px32, W = Atlas.w;
		for (let t = 0; t < NT; t++) {
			const ax = (t % 64) * 16, ay = Math.floor(t / 64) * 16;
			let clear = true, solid = true;
			for (let y = 0; y < TPX; y++) for (let x = 0; x < TPX; x++) {
				const c = a[(ay + y) * W + ax + x];
				this.tilePx[t * TT + y * TPX + x] = c;
				const al = c >>> 24;
				if (al !== 0) clear = false;
				if (al !== 255) solid = false;
				this.wallPx[(blockWallBase - 1 + t) * TT + y * TPX + x] = al === 0 ? 0 : ((c & 0xFF000000) | (shade32(c, 0.5) & 0xFFFFFF)) >>> 0;
			}
			this.tileKind[t] = clear ? 0 : solid ? 1 : 2;
		}
		for (let k = 0; k < DATA.atlas.walls; k++) {
			for (let y = 0; y < TPX; y++) for (let x = 0; x < TPX; x++) this.wallPx[k * TT + y * TPX + x] = a[(DATA.atlas.wallY + y) * W + k * 16 + x];
		}
		this.tufts.clear(); this.leafTones.clear();
		for (let t = 0; t < NT; t++) if (IS_LEAF[t]) { const tn = LeafTufts.tones(this.tilePx, t * TT); this.leafTones.set(t, tn); this.tufts.set(t, LeafTufts.make(tn)); }
	},

	/** Paints section `sy` (rows sy*16 ... sy*16+15) of a chunk into this.buf */
	paint(world, ch, sy) {
		const out = this.buf, W = SEC_PX, H = ch.H, y0 = sy * 16;
		out.fill(0);
		const back = world.backdrop(ch), tiles = ch.tiles, art = this.tilePx, walls = this.wallPx, kinds = this.tileKind, wc = this.wallCount;
		const lev = ch.partials > 0 ? ch.level : null;
		const left = world.chunks.get(ch.cx - 1), right = world.chunks.get(ch.cx + 1);
		const wx0 = ch.cx * chunkW;
		for (let lx = 0; lx < chunkW; lx++) {
			const colBase = lx * H, ox = lx * TPX;
			for (let ly = 0; ly < 16; ly++) {
				const y = y0 + ly;
				if (y < 0 || y >= H) continue;
				const raw = tiles[colBase + y];
				const oy = ly * TPX;
				const opaque = OPAQUE[raw];
				const wall = back[colBase + y] - 1;
				if (wall >= 0 && wall < wc && !opaque) {
					const src = wall * TT;
					for (let yy = 0; yy < TPX; yy++) { const o = (oy + yy) * W + ox, s = src + yy * TPX; for (let xx = 0; xx < TPX; xx++) out[o + xx] = walls[s + xx]; }
				}
				if (raw === 0) continue;
				if (lev && lev[colBase + y] !== 0) continue;
				const kind = kinds[raw];
				// which of the block's four pictures goes here: always the same one for a place
				let pick = 0;
				const fm = TILE_FLIP[raw];
				if (fm !== 0) {
					let hsh = (Math.imul(wx0 + lx, 374761393) + Math.imul(y, 668265263)) | 0;
					hsh = Math.imul(hsh ^ (hsh >> 13), 1274126177);
					pick = (hsh >> 16) & fm;
				}
				const fx = pick & 1, fy = pick & 2;
				const src = raw * TT;
				if (kind === 1) {
					for (let yy = 0; yy < TPX; yy++) {
						const o = (oy + yy) * W + ox, s = src + (fy ? TPX - 1 - yy : yy) * TPX;
						if (fx) for (let xx = 0; xx < TPX; xx++) out[o + xx] = art[s + TPX - 1 - xx];
						else for (let xx = 0; xx < TPX; xx++) out[o + xx] = art[s + xx];
					}
				} else if (kind === 2) {
					for (let yy = 0; yy < TPX; yy++) {
						const o = (oy + yy) * W + ox, s = src + (fy ? TPX - 1 - yy : yy) * TPX;
						for (let xx = 0; xx < TPX; xx++) {
							const c = art[s + (fx ? TPX - 1 - xx : xx)];
							const al = c >>> 24;
							if (al === 255) out[o + xx] = c;
							else if (al !== 0) { const under = out[o + xx]; out[o + xx] = (under >>> 24) === 0 ? c : mix32(under, c, al / 255); }
						}
					}
				}
				// edges where solid ground meets open space
				if (SUPPORTS[raw] && opaque) {
					const upOpaque = y > 0 ? OPAQUE[tiles[colBase + y - 1]] : 0;
					if (!upOpaque) { const o = oy * W + ox; for (let xx = 0; xx < TPX; xx++) out[o + xx] = shade32(out[o + xx], 1.12); }
					const dnOpaque = y + 1 < H ? OPAQUE[tiles[colBase + y + 1]] : 1;
					if (!dnOpaque) { const o = (oy + TPX - 1) * W + ox; for (let xx = 0; xx < TPX; xx++) out[o + xx] = shade32(out[o + xx], 0.6); }
					let lf = 1;
					if (lx > 0) lf = OPAQUE[tiles[colBase - H + y]]; else if (left && y < left.H) lf = OPAQUE[left.tiles[(chunkW - 1) * left.H + y]];
					if (!lf) for (let yy = 0; yy < TPX; yy++) { const o = (oy + yy) * W + ox; out[o] = shade32(out[o], 0.72); }
					let rt = 1;
					if (lx + 1 < chunkW) rt = OPAQUE[tiles[colBase + H + y]]; else if (right && y < right.H) rt = OPAQUE[right.tiles[y]];
					if (!rt) for (let yy = 0; yy < TPX; yy++) { const o = (oy + yy) * W + ox + TPX - 1; out[o] = shade32(out[o], 0.66); }
				}
			}
		}
		this.paintTufts(out, ch, sy, left, right);
		return out;
	},
	/** Leaves sticking out of a canopy: every open cell with a leaf block beside it gets that block's tufts */
	paintTufts(buf, ch, sy, left, right) {
		if (this.tufts.size === 0) return;
		const W = SEC_PX, H = ch.H, y0 = sy * 16;
		const at = (lx, y) => {
			if (y < 0 || y >= H) return 0;
			if (lx < 0) return left && y < left.H ? left.tiles[(chunkW - 1) * left.H + y] : 0;
			if (lx >= chunkW) return right && y < right.H ? right.tiles[y] : 0;
			return ch.tiles[lx * H + y];
		};
		for (let lx = 0; lx < chunkW; lx++) for (let ly = 0; ly < 16; ly++) {
			const y = y0 + ly;
			if (y < 0 || y >= H) continue;
			const raw = at(lx, y);
			if (OPAQUE[raw] || IS_LEAF[raw]) continue;
			for (let side = 0; side < 4; side++) {
				const nraw = side === 0 ? at(lx, y + 1) : side === 1 ? at(lx, y - 1) : side === 2 ? at(lx + 1, y) : at(lx - 1, y);
				if (!IS_LEAF[nraw]) continue;
				const tf = this.tufts.get(nraw);
				if (!tf) continue;
				const list = tf[side][hashU(ch.x0 + lx, y, 7717 + side) & 1];
				const base = ly * TPX * W + lx * TPX;
				for (let k = 0; k < list.length; k += 2) { const p = list[k]; buf[base + Math.floor(p / TPX) * W + (p % TPX)] = list[k + 1]; }
			}
		}
	},
};

// ===== gl.js =====
// The renderer: WebGL 2, one shader, quads batched by texture. Positions are screen pixels (the top
// left is 0,0), colours are 32-bit RGBA made by rgba(). The texture sheet (the atlas) holds every
// picture; land sections and the light have textures of their own.

const Atlas = { w: DATA.atlas.w, h: DATA.atlas.h, px: null, px32: null, tex: null, orig: null, gen: 0 };
const rgba = (hex, a = 1) => (((Math.max(0, Math.min(1, a)) * 255) << 24) | ((hex & 255) << 16) | (hex & 0xFF00) | ((hex >> 16) & 255)) >>> 0;
const WHITE = 0xFFFFFFFF;
const grey = (v, a = 1) => { const c = Math.floor(clampD(v, 0, 1) * 255); return (((a * 255) << 24) | (c << 16) | (c << 8) | c) >>> 0; };

const R = {

/** Loads the atlas picture, keeps its pixels (the painter and the icons read them) and adds the shapes */
function loadAtlas() {
	return new Promise((resolve, reject) => {
		const im = new Image();
		im.onload = () => {
			const c = document.createElement("canvas");
			c.width = Atlas.w; c.height = Atlas.h;
			const g = c.getContext("2d", { willReadFrequently: true });
			g.drawImage(im, 0, 0);
			const id = g.getImageData(0, 0, Atlas.w, Atlas.h);
			Atlas.px = new Uint8Array(id.data.buffer);
			Atlas.px32 = new Uint32Array(id.data.buffer);
			// a white square and a round dot in the room kept free at the bottom of the sheet
			const fy = DATA.atlas.freeY + 2, p = Atlas.px32, W = Atlas.w;
			for (let y = 0; y < 6; y++) for (let x = 0; x < 6; x++) p[(fy + y) * W + 2 + x] = 0xFFFFFFFF;
			const D = 64, cx0 = 16;
			for (let y = 0; y < D; y++) for (let x = 0; x < D; x++) {
				const dx = (x + 0.5 - D / 2) / (D / 2), dy = (y + 0.5 - D / 2) / (D / 2);
				p[(fy + y) * W + cx0 + x] = dx * dx + dy * dy <= 1 ? 0xFFFFFFFF : 0x00FFFFFF;
			}
			R.wu = 5 / W; R.wv = (fy + 3) / Atlas.h;
			R.cu0 = cx0 / W; R.cv0 = fy / Atlas.h; R.cu1 = (cx0 + D) / W; R.cv1 = (fy + D) / Atlas.h;
			Atlas.orig = Atlas.px.slice();
			Atlas.tex = R.makeTex(Atlas.w, Atlas.h, Atlas.px, false);
			resolve();
		};
		im.onerror = () => reject(new Error("the art could not be read"));
		im.src = ATLAS_PNG;
	});
}
/** where a named sprite frame is in the atlas: [x, y, w, h] */
function spriteRect(name, frame = 0) { const r = DATA.atlas.rects[name]; return r ? r[Math.min(frame, r.length - 1)] : null; }
/** where a tile's picture is in the atlas */
const tileAX = (t) => (t % 64) * 16;
const tileAY = (t) => Math.floor(t / 64) * 16;

// ===== s01_sound.js =====
// Sound effects, made as they play with Web Audio (the Swift game makes its own the same way). The
// sound starts on the first touch or key, as browsers ask.

const Sound = {
	ctx: null, out: null, noiseBuf: null, last: new Map(), on: true, volume: 0.8,
	unlock() {
		if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {}); return; }

			this.out.connect(this.ctx.destination);
			const n = this.ctx.sampleRate;
			this.noiseBuf = this.ctx.createBuffer(1, n, n);
			const d = this.noiseBuf.getChannelData(0);
			for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
		} catch (e) { this.ctx = null; }
	},
	setVolume(v) { this.volume = v; if (this.out) this.out.gain.value = v; },
	/** a burst of filtered noise */
	noise(t0, dur, type, freq, q, vol, freqTo = 0) {
		const c = this.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
		src.buffer = this.noiseBuf;
		f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
		if (freqTo > 0) f.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur);
		g.gain.setValueAtTime(vol, t0);
		g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
		src.connect(f); f.connect(g); g.connect(this.out);
		src.start(t0, Math.random() * 0.5, dur + 0.05);
	},
	/** a tone that slides from one pitch to another and fades */
	tone(t0, dur, type, f0, f1, vol, attack = 0.004) {
		const c = this.ctx, o = c.createOscillator(), g = c.createGain();
		o.type = type;
		o.frequency.setValueAtTime(f0, t0);
		if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
		g.gain.setValueAtTime(0.0001, t0);
		g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
		g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
		o.connect(g); g.connect(this.out);
		o.start(t0); o.stop(t0 + dur + 0.05);

	play(name, vol) {
		if (!this.on || !this.ctx || this.ctx.state !== "running") return;

			case "digSand": N(0.1, "highpass", 2500, 0.6, 0.25); break;
			case "digWood": N(0.06, "bandpass", 500, 2, 0.5); S(0.07, "triangle", 260, 180, 0.25); break;
			case "digLeaves": N(0.08, "highpass", 3800, 0.5, 0.18); break;
			case "digCrystal": S(0.16, "sine", 1800, 1700, 0.18); S(0.12, "sine", 2700, 2600, 0.1, 0.004, 0.02); break;
			case "breakStone": N(0.22, "bandpass", 1500, 0.9, 0.6, 500); S(0.08, "square", 300, 120, 0.08); break;
			case "breakDirt": N(0.2, "lowpass", 900, 0.7, 0.7, 250); break;
			case "breakWood": N(0.16, "bandpass", 420, 1.5, 0.6, 200); S(0.14, "triangle", 200, 90, 0.3); break;
			case "breakCrystal": for (let i = 0; i < 3; i++) S(0.2, "sine", 1500 + i * 520, 1400 + i * 500, 0.12, 0.004, i * 0.04); break;
			case "place": S(0.08, "sine", 170, 90, 0.5); N(0.05, "lowpass", 1200, 0.7, 0.3); break;
			case "pickup": S(0.07, "square", 660, 660, 0.07); S(0.09, "square", 990, 990, 0.07, 0.004, 0.06); break;
			case "craft": S(0.06, "triangle", 520, 300, 0.3); N(0.05, "bandpass", 1600, 2, 0.3); S(0.06, "triangle", 620, 360, 0.3, 0.004, 0.11); break;
			case "chestOpen": S(0.25, "sawtooth", 110, 160, 0.07, 0.03); N(0.12, "lowpass", 600, 1, 0.3); break;
			case "door": S(0.09, "triangle", 160, 110, 0.4); N(0.07, "bandpass", 700, 1.5, 0.3); break;
			case "swing": case "swingLight": N(0.14, "bandpass", 900, 1.6, 0.25, 2600); break;
			case "swingHeavy": N(0.22, "bandpass", 500, 1.4, 0.35, 1600); break;
			case "hit": N(0.08, "lowpass", 1400, 1, 0.6); S(0.08, "sine", 180, 80, 0.45); break;
			case "hurt": S(0.18, "square", 420, 160, 0.12); N(0.1, "lowpass", 900, 1, 0.3); break;

/** the sound of mining a block, by what it is made of */
function digSound(t, broke) {
	const d = TILE[t];
	let m = "Dirt";
	if (IS_LEAF[t] || PLANT[t]) m = "Leaves";
	else if (d.key.includes("crystal") || d.key === "amethyst" || d.key === "glass" || d.key === "ice") m = "Crystal";
	else if (d.toolClass === "pickaxe") m = "Stone";
	else if (d.toolClass === "axe") m = "Wood";
	else if (d.key.includes("sand") || d.key === "gravel" || d.key === "snow") m = "Sand";
	if (broke) sfx(m === "Leaves" ? "digLeaves" : m === "Sand" ? "breakDirt" : "break" + m, 0.7);
	else sfx("dig" + m, 0.45);
}

	/** the column of a ladder the body is on, or null */
	ladderColumn() {
		const pb = this.pb;
		const cx = Math.floor(pb.x), frac = pb.x - cx;
		const cols = [cx];
		if (frac < 0.34) cols.push(cx - 1); else if (frac > 0.66) cols.push(cx + 1);
		const y0 = Math.floor(bodyTop(pb) + 0.1), y1 = Math.floor(pb.y + 0.05);
		for (const tx of cols) for (let y = y0; y <= y1; y++) {
			const t = this.world.tile(tx, y);
			if (t === T.ladder) return tx;
			if (t === T.platform && this.world.tile(tx, y + 1) === T.ladder) return tx;
		}
		return null;
	}
	ledgeWithinReach(dir) {
		const pb = this.pb, w = this.world;

		for (let k = 0; k <= 3; k++) {
			const row = feet - k;
			if (!w.solid(fx, row) && !w.solid(fx, row - 1) && w.solid(fx, row + 1)) return pb.y - (row + 1) <= 2.6;
		}
		return false;
	}
	checkHazards(dt) {

		if (t < 0) t = w.boxHurts(bodyLeft(pb) - 0.04, bodyTop(pb) + 0.2, bodyRight(pb) + 0.04, pb.y - 0.1);
		if (t === T.spikes || t === T.cactus) this.damagePlayer(t === T.spikes ? 6 : 3, pb.x - this.facing, 5, false);
		if (w.tile(Math.floor(pb.x), Math.floor(pb.y - 0.5)) === T.campfire) this.playerBurn = Math.max(this.playerBurn, 1.2);
		if (pb.inLava) {
			const charm = this.inv.wearing("emberCharm");
			this.playerBurn = Math.max(this.playerBurn, charm ? 1 : 2.5);
			this.lavaT += dt;
			if (this.lavaT > 0.35) { this.lavaT = 0; this.damagePlayer(charm ? 2 : 5, pb.x, 0, false); }
		} else this.lavaT = 0;
		if (this.playerBurn > 0) {

			if (this.burnTick > 0.6) { this.burnTick = 0; this.damagePlayer(1, pb.x, 0, true); this.spawnParticles(pb.x, pb.y - 1, 0xFF8A2A, 3, 2, 0.4, -4); }
		}
	}
	headUnderWater() {
		const pb = this.pb;
		const hy = pb.y - pb.h * 0.92, hx = Math.floor(pb.x), hyI = Math.floor(hy);
		const t = this.world.tile(hx, hyI);

		return true;
	}
	updateSurvival(dt, ix) {
		if (this.mode === GameMode.creative) return;
		if (this.headUnderWater()) {
			this.air -= dt * (this.inv.wearing("divingMask") ? 1 / 3 : 1);
			if (this.air <= 0) {
				this.air = 0;
				this.drownT += dt;
				if (this.drownT >= 1) { this.drownT = 0; this.damagePlayer(2, this.pb.x, 0, true); }
			}

		this.hunger = Math.max(0, this.hunger - rate * rule("hunger") * dt);
		if (this.hunger <= 0) {
			this.starveT += dt;

		} else this.starveT = 0;
		const healRule = rule("healing");
		if (this.hunger >= 14 && this.hp < this.maxHP && healRule > 0) {
			this.regenT += dt;
			if (this.regenT >= (this.hunger >= 18 ? 0.9 : 1.6) / healRule) { this.regenT = 0; this.hp = Math.min(this.maxHP, this.hp + 1); this.hunger = Math.max(0, this.hunger - 0.12); this.bumpHUD(); }
		} else this.regenT = 0;
	}
	/** the share of a blow armour takes: 4% a point, at most 80% */
	armorShare(defense) { return Math.min(0.8, Math.max(0, defense) * 0.04); }
	get totalDefense() { return this.inv.defense; }
	damagePlayer(dmg, sx, knock = 6, ignoreArmor = false) {
		if (this.dead || this.godMode || this.mode === GameMode.creative) return;

		const hurtRule = rule("hurt");

		if (knock > 0) { this.pb.vx = (this.pb.x >= sx ? 1 : -1) * knock; this.pb.vy = -6; }
		this.floatText("-" + d, this.pb.x, this.pb.y - this.pb.h - 0.3, 0xFF5050);
		this.addShake(0.2);

	}
	heal(n) { this.hp = Math.min(this.maxHP, this.hp + n); this.bumpHUD(); }
	die() {
		if (this.dead) return;
		if (rule("deathDrop") > 0) {
			for (let i = 0; i < this.inv.slots.length; i++) { const s = this.inv.slots[i]; if (s) { this.spawnDrop(s, this.pb.x, this.pb.y - 1, rand(-3, 3), -4); this.inv.slots[i] = null; } }
		}
		this.dead = true; this.hp = 0; this.deathT = 0;
		this.spawnParticles(this.pb.x, this.pb.y - 1, 0xC03030, 24, 6, 0.9, 16);
		this.say(this.mode === GameMode.hardcore ? "You died. Your hardcore world is lost." : "You died!", 5);
		if (this.mode === GameMode.hardcore) this.hardcoreOver = true;
		this.bumpHUD();
	}
	respawn() {
		if (this.mode === GameMode.hardcore && this.hardcoreOver) return;
