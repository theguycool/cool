		const pb = this.pb;
		pb.x = this.spawnX; pb.y = this.spawnY; pb.vx = 0; pb.vy = 0;
		this.invuln = 3; this.fallPeak = 0;
		this.world.loadAround(Math.floor(this.spawnX), 3);
		if (SOLID[this.world.tile(Math.floor(pb.x), Math.floor(pb.y - 0.5))]) pb.y = this.world.surfaceY(Math.floor(this.spawnX));
		this.camX = pb.x; this.camY = pb.y - 2;
		this.say("Respawned.", 2);
	}

	// ---- camera, streaming, light
	updateCamera(dt) {
		const st = this.settings, pb = this.pb;
		let leadTarget = 0;
		if (st.camLookAhead && !st.camDirect && Math.abs(pb.vx) > 1) leadTarget = this.facing * 1.6;
		this.camLead += (leadTarget - this.camLead) * Math.min(1, dt * 2.5);
		const fx = pb.x + this.camLead, fy = pb.y - 1.6;
		const dz = st.camDirect ? 0 : clampD(st.camDeadZone, 0, 4);
		if (fx > this.camTX + dz) this.camTX = fx - dz; else if (fx < this.camTX - dz) this.camTX = fx + dz;
		const dzy = dz * 0.75;
		if (fy > this.camTY + dzy) this.camTY = fy - dzy; else if (fy < this.camTY - dzy) this.camTY = fy + dzy;
		if (Math.abs(this.camTX - this.camX) > 40 || Math.abs(this.camTY - this.camY) > 40 || !st.camSmoothOn) { this.camX = this.camTX; this.camY = this.camTY; }
		else {
			const rate = st.camDirect ? 12 : 2.5 + clampD(st.camFollow, 0, 1) * 11.5;
			const k = 1 - Math.exp(-rate * dt);
			this.camX += (this.camTX - this.camX) * k;
			this.camY += (this.camTY - this.camY) * k;
		}
		const halfW = this.viewTilesW * 0.5, halfH = this.viewTilesH * 0.5;
		if (!this.gen.infinite && this.viewTilesW < this.gen.width) this.camX = clampD(this.camX, halfW, this.gen.width - halfW);
		this.camY = clampD(this.camY, halfH - 14, this.world.H - halfH + 1);
	}
	updateStreaming() {
		const radius = Math.ceil(this.viewTilesW * 0.5 / chunkW) + 2;
		const keep = streamKeep(this);
		this.world.stream(Math.floor(this.camX), radius, 3, 1, keep);
		const pc = floorDiv(Math.floor(this.pb.x), chunkW);
		if (!this.world.chunks.has(pc)) this.world.loadChunk(pc);
	}
	heldLightLevel() {
		const id = this.heldItem;
		if (!id) return 0;
		const t = itemTile(id);
		if (t >= 0 && LIGHT[t] >= 9) return LIGHT[t] - 2;
		return 0;
	}
	/** moving lights: a flat list of x, y, level */
	dynamicLights() {
		const pb = this.pb;
		let hl = Math.max(this.heldLightLevel(), this.inv.wearing("headlamp") ? 11 : 5);
		const out = [Math.floor(pb.x), Math.floor(pb.y - pb.h * 0.6), hl];
		lightHooks.forEach((f) => f(this, out));
		return out;
	}
	updateLight(dt) {
		this.lightTimer -= dt;
		const dyn = this.dynamicLights();
		let key = dyn.length;
		for (let i = 0; i < dyn.length; i++) key = (Math.imul(key, 31) + dyn[i] * (i % 3 === 0 ? 7 : i % 3 === 1 ? 13 : 1)) | 0;
		const light = this.light, world = this.world;
		const vw = Math.ceil(this.viewTilesW) + 2, vh = Math.ceil(this.viewTilesH) + 2;
		const vx0 = Math.floor(this.camX - this.viewTilesW * 0.5) - 1, vy0 = Math.floor(this.camY - this.viewTilesH * 0.5) - 1;
		const covered = light.covers(vx0 - 3, vy0 - 3, vx0 + vw + 3, vy0 + vh + 3);
		let edited = false;
		if (world.editAny) {
			if (world.editX1 >= light.ox - 1 && world.editX0 <= light.ox + light.w && world.editY1 >= light.oy - 1 && world.editY0 <= light.oy + light.h) edited = true;
			else world.editAny = false;
		}
		const needsStatic = !light.valid || !covered || light.skyUsed !== this.skyLevel || light.dimUsed !== world.dim || edited || light.layoutUsed !== world.layoutVersion;
		const amb = this.ambientLight();
		const t0 = performance.now();
		if (!needsStatic) {
			if (light.dynUsed === key && light.ambUsed === amb && light.nightUsed === this.dayFactor) return;
			light.applyDynamic(dyn);
		} else {
			if (this.lightTimer > 0 && light.valid && covered && light.dimUsed === world.dim) return;
			this.lightTimer = 0.04;
			const m = 17;
			const ox = floorDiv(vx0 - m, 4) * 4, oy = floorDiv(vy0 - m, 4) * 4;
			const w = (Math.floor(((vx0 + vw + m) - ox + 4) / 4) + 1) * 4, h = (Math.floor(((vy0 + vh + m) - oy + 4) / 4) + 1) * 4;
			light.compute(world, ox, oy, w, h, this.skyLevel, dyn);
		}
		light.dynUsed = key; light.ambUsed = amb; light.nightUsed = this.dayFactor;
		const n = light.w * light.h * 4;
		if (this.lightDark.length !== n) { this.lightDark = new Uint8Array(n); this.lightGlow = new Uint8Array(n); }
		light.buildPixels(this.lightDark, this.lightGlow, amb, 1 - this.dayFactor);
		this.lightRev++;
		PERF.lightMs = PERF.lightMs * 0.9 + (performance.now() - t0) * 0.1;
	}
	ambientLight() {
		if (this.fullBright) return 1;
		return this.world.dim === Dimension.umbral ? 0.2 : 0.07;
	}

	// ---- random world ticks: crops grow, grass spreads, saplings grow, cut crowns wither
	updateWorldTicks(dt) {
		const px = Math.floor(this.pb.x), py = Math.floor(this.pb.y), w = this.world;
		for (let k = 0; k < 7; k++) {
			const x = px + randInt(-40, 40), y = py + randInt(-26, 26);
			const t = w.tile(x, y);
			const grow = 0.35;
			if (t === T.wheat1) { if (Math.random() < grow) w.set(x, y, T.wheat2); }
			else if (t === T.wheat2) { if (Math.random() < grow) w.set(x, y, T.wheat3); }
			else if (t === T.carrot1) { if (Math.random() < grow) w.set(x, y, T.carrot2); }
			else if (t === T.carrot2) { if (Math.random() < grow) w.set(x, y, T.carrot3); }
			else if (t === T.sapling) { if (Math.random() < grow * 0.4) this.growSapling(x, y); }
			else if (t === T.dirt) {
				if (w.dim === Dimension.overworld && y < w.skyTop(x) + 1 && w.tile(x, y - 1) === T.air) {
					if ((w.tile(x - 1, y) === T.grass || w.tile(x + 1, y) === T.grass) && Math.random() < 0.2) w.set(x, y, T.grass);
				}
			} else if (t === T.grass) {
				if (OPAQUE[w.tile(x, y - 1)] && Math.random() < 0.3) w.set(x, y, T.dirt);
			}
		}
		this.updateLeafDecay(dt);
	}
	treeRoom(t) { return t === T.air || t === T.tallGrass || t === T.flowerR || t === T.flowerY || t === T.deadBush; }
	/** a sapling grows into a tree that suits its land, as tall as the room above allows */
	growSapling(x, y) {
		const w = this.world;
		if (w.tile(x, y) !== T.sapling || !w.isSoil(w.tile(x, y + 1))) return false;
		const r = Math.random();
		let log = T.log, leaves = T.leaves, shape = 0;
		const B = Biome;
		switch (this.biomeAt(x)) {
			case B.tundra: case B.mountain: shape = 2; leaves = T.pineLeaves; break;
			case B.jungle: shape = 3; log = T.jungleLog; leaves = T.jungleLeaves; break;
			case B.savanna: shape = 4; break;
			case B.swamp: shape = 5; leaves = T.jungleLeaves; break;
			default: if (r < 0.3) { shape = 1; log = T.birchLog; leaves = T.birchLeaves; }
		}
		const wants = [4 + Math.floor(r * 4), 6 + Math.floor(r * 4), 6 + Math.floor(r * 5), 9 + Math.floor(r * 6), 5 + Math.floor(r * 3), 4 + Math.floor(r * 2)];
		const least = [4, 5, 6, 8, 5, 4];
		let room = 1;
		while (room < wants[shape] + 2 && this.treeRoom(w.tile(x, y - room))) room++;
		const th = Math.min(wants[shape], room - 2);
		if (th < least[shape]) return false;
		const gy = y + 1;
		for (let k = 1; k <= th; k++) w.set(x, gy - k, log);
		const leaf = (lx, ly) => { if (this.treeRoom(w.tile(lx, ly))) w.set(lx, ly, leaves); };
		const top = gy - th;
		if (shape === 1) { for (let dy = -4; dy <= 0; dy++) { const ww = (dy === -4 || dy === 0) ? 1 : 2; for (let dx = -ww; dx <= ww; dx++) leaf(x + dx, top + dy); } leaf(x, top - 5); }
		else if (shape === 2) { for (let layer = 0; layer < th - 1; layer++) { const ww = Math.min(3, 1 + Math.floor(layer / 2)); for (let dx = -ww; dx <= ww; dx++) leaf(x + dx, top - 1 + layer); } leaf(x, top - 2); }
		else if (shape === 3) { for (let dy = -3; dy <= 1; dy++) for (let dx = -4; dx <= 4; dx++) if (!(Math.abs(dx) === 4 && Math.abs(dy + 1) > 1) && Math.abs(dx) + Math.abs(dy + 1) <= 6) leaf(x + dx, top + dy); }
		else if (shape === 4) { for (let dx = -4; dx <= 4; dx++) leaf(x + dx, top); for (let dx = -2; dx <= 2; dx++) leaf(x + dx, top - 1); }
		else if (shape === 5) { for (let dx = -3; dx <= 3; dx++) { leaf(x + dx, top); if (Math.abs(dx) < 3) leaf(x + dx, top - 1); } }
		else { for (let dy = -3; dy <= 1; dy++) for (let dx = -2; dx <= 2; dx++) if (!(Math.abs(dx) === 2 && (dy === -3 || dy === 1))) leaf(x + dx, top + dy); }
		this.spawnParticles(x + 0.5, top + 0.5, 0x56A83F, 8, 3, 0.6, 10);
		return true;
	}
	logNear(x, y, r) {
		for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (IS_LOG[this.world.tile(x + dx, y + dy)]) return true;
		return false;
	}
	/** where a trunk was cut, leaves with no trunk nearby wither over half a minute */
	updateLeafDecay(dt) {
		if (!this.decayZones.length) return;
		const keep = [];
		for (const z of this.decayZones) {
			z.t -= dt;
			for (let k = 0; k < 4; k++) {
				const x = z.x + randInt(-7, 7), y = z.y + randInt(-10, 4);
				if (IS_LEAF[this.world.tile(x, y)] && !this.logNear(x, y, 4)) this.breakTile(x, y, false);
			}
			if (z.t > 0) keep.push(z);
		}
		this.decayZones = keep;
	}

	// ---- drops, particles, leaves, floating text
	updateDrops(dt) {
		const pb = this.pb;
		for (let i = 0; i < this.drops.length; i++) {
			const d = this.drops[i];
			d.age += dt;
			if (d.pickDelay > 0) d.pickDelay -= dt;
			if (d.age > 400) { this.drops.splice(i--, 1); continue; }
			const px = pb.x, py = pb.y - pb.h * 0.5;
			const dx = px - d.x, dy = py - (d.y - 0.15);
			const dist = Math.hypot(dx, dy);
			if (d.heldBack && dist > 3.6) d.heldBack = false;
			const canTake = !this.dead && d.pickDelay <= 0 && !d.heldBack && this.inv.canFit(d.stack.id, 1);
			if (canTake && dist < 3.2) {
				const k = 16 * (1 + (3.2 - dist) * 0.3) / Math.max(dist, 0.1);
				d.vx = dx * k; d.vy = dy * k;
				d.x += d.vx * dt; d.y += d.vy * dt;
			} else {
				const b = Drops.body;
				b.x = d.x; b.y = d.y; b.vx = d.vx; b.vy = d.vy; b.onGround = d.onGround;
				b.vy = Math.min(b.vy + gravityG() * 0.8 * dt, 18);
				b.vx *= 1 - Math.min(1, dt * (d.onGround ? 6 : 0.6));
				this.world.moveBody(b, dt, 0, false, null);
				if (b.inWater) { b.vy = Math.min(b.vy, 1.5); b.vx *= 0.9; }
				d.x = b.x; d.y = b.y; d.vx = b.vx; d.vy = b.vy; d.onGround = b.onGround;
			}
			if (canTake && dist < 0.9) {
				const left = this.inv.add(d.stack.id, d.stack.n, d.stack.extra, d.stack.inf);
				if (left < d.stack.n) {
					if (d.stack.id === "mat:relicFragment") this.journal.relics += d.stack.n - left;
					sfx("pickup", 0.5);
					this.floatText("+" + (d.stack.n - left) + " " + itemName(d.stack.id), px, pb.y - pb.h - 0.5, 0xFFF0A0);
					this.bumpHUD();
				}
				if (left === 0) { this.drops.splice(i--, 1); continue; }
				d.stack.n = left;
			}
		}
	}
	updateParticles(dt) {
		let w = 0;
		for (const p of this.particles) {
			p.life -= dt;
			if (p.life <= 0) continue;
			p.vy += p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt;
			this.particles[w++] = p;
		}
		this.particles.length = w;
		w = 0;
		for (const f of this.floats) { f.life -= dt * 0.8; f.y -= dt * 0.9; if (f.life > 0) this.floats[w++] = f; }
		this.floats.length = w;
	}
	/** a leaf come loose from a canopy, drifting down */
	dropLeaf(x, y, t) {
		if (this.leafFlakes.length > 90) return;
		const tn = Painter.leafTones.get(t) || [0xFF4A9A6A, 0xFF3A7A4C];
		this.leafFlakes.push({ x, y, vy: rand(0.6, 1.2), phase: Math.random() * 6, life: rand(7, 11), light: tn[1], dark: tn[2] || tn[1], landed: false });
	}
	updateLeafFall(dt) {
		// leaves come loose from the canopies on screen now and then
		if (Math.random() < dt * 0.9) {
			const x = Math.floor(this.camX + rand(-0.5, 0.5) * this.viewTilesW), y0 = Math.floor(this.camY - this.viewTilesH * 0.5);
			for (let y = y0; y < y0 + this.viewTilesH; y++) {
				const t = this.world.tile(x, y);
				if (IS_LEAF[t]) { if (this.world.tile(x, y + 1) === T.air) this.dropLeaf(x + Math.random(), y + 1.0, t); break; }
				if (SOLID[t]) break;
			}
		}
		let w = 0;
		for (const f of this.leafFlakes) {
			f.life -= dt;
			if (f.life <= 0) continue;
			if (!f.landed) {
				f.phase += dt * 2.2;
				f.x += Math.sin(f.phase) * 0.9 * dt;
				f.y += f.vy * dt;
				const t = this.world.tile(Math.floor(f.x), Math.floor(f.y + 0.05));
				if (SOLID[t] || LIQUID[t]) { f.landed = true; f.y = Math.floor(f.y + 0.05) - 0.06; f.life = Math.min(f.life, 2.5); }
			}
			this.leafFlakes[w++] = f;
		}
		this.leafFlakes.length = w;
	}
	updateAutosave(dt) {
		if (!this.settings.autosave || this.isTest) return;
		this.autosaveT += dt;
		if (this.autosaveT >= 60) { this.autosaveT = 0; saveGameSoon(this); }
	}

	// ---- doors
	isDoor(t) { return t === T.doorClosed || t === T.doorOpen; }
	doorCells(x, y) {
		const w = this.world;
		let top = y, bot = y;
		if (this.isDoor(w.tile(x, y - 1)) && !this.isDoor(w.tile(x, y + 1))) top = y - 1;
		else if (this.isDoor(w.tile(x, y + 1))) bot = y + 1;
		return [top, bot];
	}
	doorBlocked(x, top, bot) {
		const pb = this.pb;
		if (bodyRight(pb) > x + 0.05 && bodyLeft(pb) < x + 0.95 && pb.y > top + 0.05 && bodyTop(pb) < bot + 0.95) return true;
		for (const m of this.mobs) if (m.hp > 0 && bodyRight(m.b) > x + 0.05 && bodyLeft(m.b) < x + 0.95 && m.b.y > top + 0.05 && bodyTop(m.b) < bot + 0.95) return true;
		return false;
	}
	setDoor(x, y, open) {
		const c = this.doorCells(x, y);
		if (!open && this.doorBlocked(x, c[0], c[1])) return;
		for (let yy = c[0]; yy <= c[1]; yy++) if (this.isDoor(this.world.tile(x, yy))) this.world.set(x, yy, open ? T.doorOpen : T.doorClosed);
	}
	toggleDoor(x, y) {
		this.setDoor(x, y, this.world.tile(x, y) === T.doorClosed);
		sfx("door", 0.7);
		this.spawnParticles(x + 0.5, y + 0.5, 0xA97B45, 2, 1.5, 0.3, 8);
	}
	/** walking into a closed door opens it, and it closes behind the player */
	doorTouch(ix) {
		if (ix === 0) return;
		const pb = this.pb;
		const fx = Math.floor(pb.x + (ix > 0 ? 1 : -1) * (pb.w * 0.5 + 0.2));
		for (const yy of [Math.floor(pb.y - 0.5), Math.floor(pb.y - 1.4)]) {
			if (this.world.tile(fx, yy) === T.doorClosed) {
				this.setDoor(fx, yy, true);
				const c = this.doorCells(fx, yy);
				if (!this.walkDoors.some((w) => w.x === fx && w.y === c[0]) && this.walkDoors.length < 16) this.walkDoors.push({ x: fx, y: c[0], t: 0 });
				break;
			}
		}
	}
	updateWalkDoors(dt) {
		if (!this.walkDoors.length) return;
		const keep = [], pb = this.pb;
		for (const w of this.walkDoors) {
			w.t += dt;
			if (this.world.tile(w.x, w.y) !== T.doorOpen) continue;
			const c = this.doorCells(w.x, w.y);
			const away = Math.abs(pb.x - (w.x + 0.5)) > pb.w * 0.5 + 1.1 || pb.y < c[0] - 0.5 || bodyTop(pb) > c[1] + 1.5;
			if (w.t > 0.5 && away && !this.doorBlocked(w.x, c[0], c[1])) { this.setDoor(w.x, w.y, false); sfx("door", 0.5); continue; }
			if (w.t < 60) keep.push(w);
		}
		this.walkDoors = keep;
	}

	// ---- crafting
	stationAvailable(s) {
		if (s === "hand" || this.isCreative) return true;
		const tiles = STATION_TILES[s];
		if (!tiles) return false;
		const px = Math.floor(this.pb.x), py = Math.floor(this.pb.y - 1);
		for (let dy = -4; dy <= 3; dy++) for (let dx = -5; dx <= 5; dx++) if (tiles.includes(this.world.tile(px + dx, py + dy))) return true;
		return false;
	}
	canCraft(r) { return this.stationAvailable(r.station) && this.inv.canAfford(r.cost) && this.inv.canFit(r.out, r.n); }
	craft(r) {
		if (!this.canCraft(r)) { if (!this.stationAvailable(r.station)) this.say("Needs a " + STATION_NAMES[r.station] + " nearby.", 2); return false; }
		for (const c of r.cost) this.inv.remove(c[0], c[1]);
		if (!this.journal.crafted.includes(r.out)) this.journal.crafted.push(r.out);
		sfx("craft", 0.6);
		const left = this.inv.add(r.out, r.n);
		if (left > 0) this.spawnDrop(stack(r.out, left), this.pb.x, this.pb.y - 1, 2, -3);
		this.floatText("+" + r.n + " " + itemName(r.out), this.pb.x, this.pb.y - 2.2, 0xFFE070);
		this.bumpHUD();
		return true;
	}
	/** how many times a recipe could be made now */
	craftableCount(r) {
		let n = 99;
		for (const c of r.cost) n = Math.min(n, Math.floor(this.inv.total(c[0]) / c[1]));
		return n;
	}
}

// Later phases add to the tick, the lights and what streaming keeps loaded through these lists.
const tickHooks = [];
/** each part of the game saves and loads its own share of a world through these (see p19_save) */
const saveHooks = [], loadHooks = [];
const lightHooks = [];
function streamKeep(g) { return null; }
/** vehicles, mounts and seats take the controls in later phases; true when one did */
function playerControlHook(g, ix, jumpPressed, dt) { return false; }
const Drops = { body: makeBody(0, 0, 0.3, 0.3) };

// ===== p14d_tools.js =====
// Using what is in hand: tapping the world, mining, felling trees, placing blocks and doors, farming,
// eating and chests (the Swift game's p14c_input and p14d_tools).

Object.assign(Game.prototype, {
	// ---- the pointer, in world blocks
	pointerDown(wx, wy) {
		this.aimX = wx; this.aimY = wy; this.aimValid = true;
		this.downTime = 0;
		this.usePressedFlag = false;
		this.touchActive = true;
		const fight = this.heldItem && isWeaponItem(this.heldItem) && this.hostileAt(wx, wy);
		if (!fight && this.isInteractive(wx, wy)) { this.pendingInteract = true; this.useHeld = false; }
		else { this.pendingInteract = false; this.useHeld = true; this.useWasHeld = false; }
		this.pointerStartX = wx; this.pointerStartY = wy;
	},
	pointerMove(wx, wy) {
		this.aimX = wx; this.aimY = wy; this.aimValid = true;
		if (this.pendingInteract) {
			const dx = wx - this.pointerStartX, dy = wy - this.pointerStartY;
			if (dx * dx + dy * dy > 0.5) { this.pendingInteract = false; this.useHeld = true; }
		}
	},
	pointerUp() {
		this.touchActive = false;
		if (this.pendingInteract) { if (this.downTime < 0.3) this.interact(this.aimX, this.aimY); this.pendingInteract = false; }
		if (this.useHeld) this.useReleasedFlag = true;
		this.useHeld = false; this.useWasHeld = false;
	},
	updatePointerTimers(dt) {
		if (this.pendingInteract) {
			this.downTime += dt;
			if (this.downTime >= 0.3) { this.pendingInteract = false; this.useHeld = true; this.useWasHeld = false; }
		}
	},
	hostileAt(wx, wy) { return hostileAtHook(this, wx, wy); },
	reachDistance() { return this.infiniteReach ? 60 : this.isCreative ? 8 : 5.5; },
	inReach(x, y) {
		const dx = x - this.pb.x, dy = y - (this.pb.y - this.pb.h * 0.6), r = this.reachDistance();
		return dx * dx + dy * dy <= r * r;
	},
	aimFacing() { return this.aimX >= this.pb.x ? 1 : -1; },

	// ---- tapping blocks that do something
	isInteractive(wx, wy) {
		const t = this.world.tile(Math.floor(wx), Math.floor(wy));
		if (INTERACTIVE.has(t)) return true;
		return interactiveHook(this, wx, wy, t);
	},
	interact(wx, wy) {
		const tx = Math.floor(wx), ty = Math.floor(wy);
		if (!this.inReach(wx, wy)) { this.say("Too far away.", 1.2); return; }
		const t = this.world.tile(tx, ty);
		if (t === T.chest && this.tryMimic(tx, ty)) return;
		if (t === T.chest || t === T.cabinet || t === T.wardrobe) {
			sfx("chestOpen", 0.7);
			this.spawnParticles(tx + 0.5, ty + 0.3, 0xC8A878, 5, 2, 0.4, 6);
			this.openChest = { x: tx, y: ty };
			this.world.chestItems(tx, ty);
			openPanel("inventory");
			return;
		}
		const st = STATION_OF_TILE.get(t);
		if (st) { this.craftStation = st; openPanel("inventory", "craft"); return; }
		if (t === T.doorClosed || t === T.doorOpen) { this.toggleDoor(tx, ty); return; }
		interactHook(this, tx, ty, t, wx, wy);
	},

	// ---- using what is in hand
	updateUse(dt) {
		if (this.useCD > 0) this.useCD -= dt;
		if (this.swingT > 0) this.swingT -= dt; else this.swingDur = 0.25;
		if (this.eatT > 0) this.eatT -= dt;
		if (this.placeCD > 0) this.placeCD -= dt;
		if (this.dead) { this.mining = false; this.usePressedFlag = false; this.useReleasedFlag = false; return; }
		const pressed = this.usePressedFlag; this.usePressedFlag = false;
		const released = this.useReleasedFlag; this.useReleasedFlag = false;
		const held = this.heldItem;
		// letting go always ends the hold, even when the finger is gone and nothing is aimed at any more
		if (!this.useHeld) { this.mining = false; this.mineP = Math.max(0, this.mineP - dt * 2); }
		if (!this.aimValid) { if (!this.useHeld) { this.handEmptied = false; this.lastUsedItem = null; } return; }
		if (useItemHook(this, held, dt, pressed, released)) return;
		if (!this.useHeld) { this.handEmptied = false; this.lastUsedItem = null; return; }
		if (pressed) this.holdItem = held;
		// what is picked up into an empty hand during a hold waits for the next press: the hold keeps digging
		if (held && this.holdItem === null && !pressed) { this.useBareHand(dt, pressed); return; }
		if (!held) {
			// a stack used up while held does not turn the hold into mining with bare hands
			if (this.lastUsedItem !== null) this.handEmptied = true;
			this.lastUsedItem = null;
			if (!this.handEmptied) this.useBareHand(dt, pressed);
			return;
		}
		this.lastUsedItem = held;
		const kind = itemKind(held);
		const d = itemDef(held);
		if (kind === "block") this.usePlaceBlock(itemTile(held), dt);
		else if (kind === "tool") this.useToolItem(d.toolKind, d.tier, d.mineSpeed, dt, pressed);
		else if (kind === "food") this.useFood(held, pressed);
		else if (held === "mat:seeds") this.usePlant(T.wheat1, pressed);
		else if (kind === "wall") this.usePlaceWall(d.wall);
		else if (kind === "armor" || kind === "gear") { if (pressed) { this.quickEquip(this.sel); this.say("Equipped.", 1); } }
		else if (isMeleeItem(held)) this.useMeleeWeapon(held, pressed, dt);
		else this.useBareHand(dt, pressed);
	},
	useBareHand(dt, pressed) {
		if (meleeHook(this, null, pressed)) return;
		this.mineStep(Math.floor(this.aimX), Math.floor(this.aimY), null, 0, dt, 1);
	},
	useToolItem(kind, tier, speed, dt, pressed) {
		const tx = Math.floor(this.aimX), ty = Math.floor(this.aimY);
		if (meleeHook(this, this.heldItem, pressed)) return;
		if (kind === "hoe" && this.useCD <= 0) {
			const t = this.world.tile(tx, ty);
			if ((t === T.grass || t === T.dirt || t === T.dryGrass || t === T.mossGrass) && this.inReach(tx + 0.5, ty + 0.5) && !this.world.solid(tx, ty - 1)) {
				this.world.set(tx, ty, T.farmland);
				if (PLANT[this.world.tile(tx, ty - 1)]) this.world.set(tx, ty - 1, T.air);
				this.useCD = 0.25; this.swingT = 0.2; this.swingDir = this.facing;
				this.spawnParticles(tx + 0.5, ty, 0x6B4626, 6, 2.5, 0.4, 12);
				return;
			}
		}
		this.mineStep(tx, ty, kind, tier, dt, speed);
	},

	// ---- mining
	mineStep(tx, ty, kind, tier, dt, toolSpeed) {
		const t = this.world.tile(tx, ty);
		if (t === T.air && this.mineWall(tx, ty, kind, tier, dt)) return;
		if (t === T.air || LIQUID[t]) {
			this.mining = false; this.mineP = 0;
			if (this.useCD <= 0 && kind && kind !== "hoe") { this.swingT = 0.2; this.swingDir = this.aimFacing(); this.facing = this.swingDir; this.useCD = 0.3; }
			return;
		}
		const def = TILE[t];
		if (def.hard >= 9999) { if (this.useCD <= 0) { this.say("That can't be broken.", 1.2); this.useCD = 0.6; } return; }
		if (!this.inReach(tx + 0.5, ty + 0.5)) { this.mining = false; this.mineP = 0; return; }
		const cls = TOOL_CLASS[t];
		if (def.tier > 0 && !this.isCreative) {
			// a tier asks for a strong enough tool of the block's own kind
			const pt = kind === cls ? tier : 0;
			if (pt < def.tier) {
				this.mining = false;
				if (this.useCD <= 0) {
					this.say(kind === cls ? "This needs a stronger " + cls + "." : "You need a " + cls + " for that.", 1.5);
					this.useCD = 0.8; this.swingT = 0.2; this.swingDir = this.aimFacing();
				}
				return;
			}
		}
		if (this.mineX !== tx || this.mineY !== ty || !this.mining) {
			if (this.mineX !== tx || this.mineY !== ty) this.mineP = 0;
			this.mineX = tx; this.mineY = ty;
		}
		this.mining = true;
		let speed = 1;
		if (kind) speed = toolSpeed * (kind === cls ? 1 : 0.35);
		if (this.isCreative) speed = 1000;
		this.mineNeed = Math.max(0.05, def.hard * 1.5);
		this.mineP += dt * speed * rule("mining");
		if (this.useCD <= 0) {
			this.swingT = 0.22; this.swingDir = this.aimFacing(); this.facing = this.swingDir; this.useCD = 0.26;
			this.spawnParticles(tx + 0.5, ty + 0.5, def.color, 3, 3, 0.4, 14);
			digSound(t, false);
		}
		if (this.mineP >= this.mineNeed) {
			this.mineP = 0; this.mining = false;
			digSound(t, true);
			if (IS_LOG[t] && kind === "axe") this.fellTree(tx, ty);
			else this.breakTile(tx, ty, true);
		}
	},
	/** pickaxes and axes knock out placed walls when nothing is in front of them */
	mineWall(tx, ty, kind, tier, dt) {
		const k = this.world.wall(tx, ty);
		if (k === 0 || !kind || kind === "hoe") return false;
		if (!this.inReach(tx + 0.5, ty + 0.5)) return false;
		if (this.mineX !== tx || this.mineY !== ty) { this.mineP = 0; this.mineX = tx; this.mineY = ty; }
		this.mining = true;
		this.mineNeed = 0.9;
		this.mineP += dt * (this.isCreative ? 1000 : TIERS[Math.max(1, tier) - 1].mineSpeed);
		if (this.useCD <= 0) { this.swingT = 0.22; this.swingDir = this.aimFacing(); this.facing = this.swingDir; this.useCD = 0.26; }
		if (this.mineP >= this.mineNeed) {
			this.mineP = 0; this.mining = false;
			this.world.setWall(tx, ty, 0);
			const back = k >= blockWallBase ? blockItem(k - blockWallBase) : "wall:" + k;
			if (!this.isCreative) this.spawnDrop(stack(back, 1), tx + 0.5, ty + 0.5, 0, -2);
		}
		return true;
	},
	minedDrops(t, x, y, byPlayer) {
		const out = tileDropStacks(t, x, y, this);
		if (!byPlayer) return out;
		const r = Math.random();
		if (t === T.tallGrass && r < 0.1) out.push(stack("mat:sunleaf", 1));
		else if ((t === T.flowerR || t === T.flowerY) && r < 0.35) out.push(stack("mat:sunleaf", 1));
		else if (t === T.mushroom && r < 0.3) out.push(stack("mat:glowcap", 1));
		else if (t === T.ice && r < 0.15) out.push(stack("mat:frostCrystal", 1));
		else if (t === T.snow && r < 0.03) out.push(stack("mat:frostCrystal", 1));
		return out;
	},
	breakTile(x, y, byPlayer, dropChance = 1) {
		const w = this.world;
		const t = w.tile(x, y);
		if (t === T.air || HARD[t] >= 9999) return;
		if (this.isDoor(t)) {
			if (this.isDoor(w.tile(x, y - 1))) w.set(x, y - 1, T.air);
			if (this.isDoor(w.tile(x, y + 1))) w.set(x, y + 1, T.air);
		}
		if (t === T.bedL && w.tile(x + 1, y) === T.bedR) w.set(x + 1, y, T.air);
		if (t === T.bedR && w.tile(x - 1, y) === T.bedL) w.set(x - 1, y, T.air);
		if (w.set(x, y, T.air) === T.air) return;
		if (IS_LOG[t] && this.decayZones.length < 24) this.decayZones.push({ x, y, t: 30 });
		if (IS_LEAF[t]) for (let k = 0; k < 3; k++) this.dropLeaf(x + rand(0.1, 0.9), y + rand(0.2, 0.8), t);
		this.spawnParticles(x + 0.5, y + 0.5, TILE[t].color, 6, 3.5, 0.5, 16);
		if (!(byPlayer && this.isCreative)) {
			for (const s of this.minedDrops(t, x, y, byPlayer)) {
				if (dropChance < 1 && Math.random() > dropChance) continue;
				this.spawnDrop(s, x + 0.5, y + 0.4, rand(-1.5, 1.5), -3);
			}
		} else if (t === T.chest) w.removeChest(x, y);
		// what stood on it falls with it
		const above = w.tile(x, y - 1);
		if (NEEDS_SUPPORT[above] && !w.supports(w.tile(x, y), above)) this.breakTile(x, y - 1, byPlayer);
		breakHooks.forEach((f) => f(this, x, y, t));
		this.bumpHUD();
	},
	fellTree(x, y) {
		const w = this.world;
		let by = y;
		while (IS_LOG[w.tile(x, by + 1)]) by++;
		let cy = by, top = y, count = 0;
		while (IS_LOG[w.tile(x, cy)] && count < 40) { top = cy; cy--; count++; }
		for (let yy = y; IS_LOG[w.tile(x, yy)] && yy >= top; yy--) this.breakTile(x, yy, true);
		for (let dy = -7; dy <= 3; dy++) for (let dx = -6; dx <= 6; dx++) {
			if (IS_LEAF[w.tile(x + dx, top + dy)] && Math.abs(dx) + Math.abs(dy + 1) <= 8) this.breakTile(x + dx, top + dy, true);
		}
	},

	// ---- placing
	canPlaceAt(tx, ty, t) {
		const w = this.world;
		if (ty < 2 || ty >= w.H - 2) return false;
		const cur = w.tile(tx, ty);
		if (!(cur === T.air || LIQUID[cur] || (PLANT[cur] && cur !== T.torch && cur !== T.lantern) || cur === T.cobweb)) return false;
		if (!this.inReach(tx + 0.5, ty + 0.5)) return false;
		if (SOLID[t]) {
			const pb = this.pb;
			if (bodyRight(pb) > tx + 0.02 && bodyLeft(pb) < tx + 0.98 && pb.y > ty + 0.02 && bodyTop(pb) < ty + 0.98 && !this.noclip) return false;
			for (const m of this.mobs) if (m.hp > 0 && bodyRight(m.b) > tx + 0.02 && bodyLeft(m.b) < tx + 0.98 && m.b.y > ty + 0.02 && bodyTop(m.b) < ty + 0.98) return false;
		}
		if (NEEDS_SUPPORT[t] && !w.supports(w.tile(tx, ty + 1), t)) return false;
		if (this.isCreative || this.flying) return true;
		// it needs a block beside it to hold on to, or a wall behind it
		for (const k of [w.tile(tx - 1, ty), w.tile(tx + 1, ty), w.tile(tx, ty - 1), w.tile(tx, ty + 1)]) if (k !== T.air && !LIQUID[k] && !(PLANT[k] && k !== T.torch)) return true;
		return w.wall(tx, ty) !== 0;
	},
	usePlaceBlock(t, dt) {
		if (this.placeCD > 0 || t < 0) return;
		const tx = Math.floor(this.aimX), ty = Math.floor(this.aimY);
		if (t === T.doorClosed || t === T.doorOpen) {
			if (this.placeDoor(tx, ty)) { if (!this.isCreative) this.inv.removeAt(this.sel, 1); this.placeCD = 0.25; this.swingT = 0.14; this.bumpHUD(); }
			return;
		}
		if (placeHook(this, t, tx, ty)) return;
		const placed = placedForm(t);
		if (!this.canPlaceAt(tx, ty, placed)) return;
		this.world.set(tx, ty, placed);
		this.world.setBuilt(tx, ty, true);
		if (t === T.chest || t === T.cabinet || t === T.wardrobe) this.world.setChestItems(tx, ty, []);
		if (!this.isCreative) this.inv.removeAt(this.sel, 1);
		sfx("place", 0.6);
		this.placeCD = 0.11; this.swingT = 0.14; this.swingDir = this.aimFacing(); this.facing = this.swingDir;
		this.bumpHUD();
	},
	placeDoor(tx, ty0) {
		const w = this.world;
		let ty = ty0;
		if (w.tile(tx, ty + 1) === T.air && w.solid(tx, ty + 2)) ty++;
		if (!w.solid(tx, ty + 1)) return false;
		for (const yy of [ty, ty - 1]) { const c = w.tile(tx, yy); if (!(c === T.air || (PLANT[c] && c !== T.torch && c !== T.lantern))) return false; }
		if (this.doorBlocked(tx, ty - 1, ty) || !this.inReach(tx + 0.5, ty + 0.5)) return false;
		w.set(tx, ty - 1, T.doorClosed); w.set(tx, ty, T.doorClosed);
		w.setBuilt(tx, ty - 1, true); w.setBuilt(tx, ty, true);
		sfx("place", 0.6);
		return true;
	},
	usePlaceWall(k) {
		if (this.placeCD > 0) return;
		const tx = Math.floor(this.aimX), ty = Math.floor(this.aimY);
		if (!this.inReach(tx + 0.5, ty + 0.5) || this.world.wall(tx, ty) !== 0) return;
		this.world.setWall(tx, ty, k);
		if (!this.isCreative) this.inv.removeAt(this.sel, 1);
		this.placeCD = 0.06; this.swingT = 0.12; this.swingDir = this.aimFacing(); this.facing = this.swingDir;
		this.bumpHUD();
	},
	usePlant(crop, pressed) {
		if (this.placeCD > 0) return;
		const tx = Math.floor(this.aimX), ty = Math.floor(this.aimY);
		if (this.world.tile(tx, ty) === T.air && this.world.tile(tx, ty + 1) === T.farmland && this.inReach(tx + 0.5, ty + 0.5)) {
			this.world.set(tx, ty, crop);
			if (!this.isCreative) this.inv.removeAt(this.sel, 1);
			this.placeCD = 0.2; this.swingT = 0.14;
			this.bumpHUD();
		}
	},
	useFood(id, pressed) {
		const tx = Math.floor(this.aimX), ty = Math.floor(this.aimY);
		if (id === "food:carrot" && this.world.tile(tx, ty) === T.air && this.world.tile(tx, ty + 1) === T.farmland) { this.usePlant(T.carrot1, pressed); return; }
		if (!pressed || this.eatT > 0) return;
		if (this.hunger >= 19.5 && this.hp >= this.maxHP && !this.isCreative) { this.say("You're not hungry.", 1.2); return; }
		const d = itemDef(id);
		this.hunger = Math.min(20, this.hunger + (d.hunger || 0));
		if (d.heal > 0) this.heal(d.heal);
		if (!this.isCreative) this.inv.removeAt(this.sel, 1);
		this.eatT = 0.5; this.useCD = 0.5;
		sfx("eat", 0.6);
		this.spawnParticles(this.pb.x + this.facing * 0.4, this.pb.y - 1.4, 0xC8A060, 5, 2, 0.4, 8);
		this.floatText("+" + Math.floor(d.hunger || 0), this.pb.x, this.pb.y - this.pb.h - 0.4, 0xE0A040);
		this.bumpHUD();
	},

	// ---- armour and gear
	/** puts on the armour or gear in a bag slot, swapping out what was worn there */
	quickEquip(i) {
		const s = this.inv.slots[i];
		if (!s) return;
		let slot = -1;
		if (s.id.startsWith("armor:")) slot = ARMOR_SLOTS.indexOf(s.id.split(":")[1]);
		else if (s.id.startsWith("gear:")) slot = this.inv.armor[FIRST_GEAR] ? (this.inv.armor[FIRST_GEAR + 1] ? FIRST_GEAR : FIRST_GEAR + 1) : FIRST_GEAR;
		if (slot < 0) return;
		const old = this.inv.armor[slot];
		this.inv.armor[slot] = s;
		this.inv.slots[i] = old;
		sfx("equip", 0.5);
		this.bumpHUD();
	},
	unequip(slot) {
		const s = this.inv.armor[slot];
		if (!s) return;
		if (this.inv.add(s.id, s.n, s.extra, s.inf) === 0) this.inv.armor[slot] = null;
		this.bumpHUD();
	},
	// ---- chests
	chestTake(cx, cy, k) {
		const items = this.world.chestItems(cx, cy);
		const s = items[k];
		if (!s) return;
		const left = this.inv.add(s.id, s.n, s.extra, s.inf);
		if (left === 0) items.splice(k, 1); else s.n = left;
		this.world.setChestItems(cx, cy, items);
		this.bumpHUD();
	},
	chestStore(cx, cy, i) {
		const s = this.inv.slots[i];
		if (!s) return;
		const items = this.world.chestItems(cx, cy);
		const ms = maxStack(s.id);
		for (const o of items) if (o.id === s.id && sameInf(o.inf, s.inf) && o.n < ms && s.n > 0) { const put = Math.min(ms - o.n, s.n); o.n += put; s.n -= put; }
		if (s.n > 0) {
			if (items.length >= 27) { this.say("Chest is full.", 1.5); this.bumpHUD(); return; }
			items.push(s);
		}
		this.inv.slots[i] = null;
		this.world.setChestItems(cx, cy, items);
		this.bumpHUD();
	},
	/** throws a stack from the bag onto the ground in front of the player */
	dropSlot(i, all = true) {
		const s = this.inv.slots[i];
		if (!s) return;
		const n = all ? s.n : 1;
		this.spawnDrop(stack(s.id, n, s.extra, s.inf), this.pb.x + this.facing * 0.6, this.pb.y - 1.2, this.facing * 4, -3, true);
		this.inv.removeAt(i, n);
		this.bumpHUD();
	},
});

const INTERACTIVE = new Set([T.chest, T.workbench, T.furnace, T.campfire, T.anvil, T.tinkerBench, T.riftForge, T.alchemyStill, T.doorClosed, T.doorOpen, T.cabinet, T.wardrobe]);
const STATION_OF_TILE = new Map([[T.workbench, "bench"], [T.furnace, "furnace"], [T.campfire, "campfire"], [T.anvil, "anvil"], [T.tinkerBench, "tinker"], [T.riftForge, "forge"], [T.alchemyStill, "still"]]);
const breakHooks = [];
// later phases fill these in (creatures, special blocks, weapons)
function placeHook(g, t, tx, ty) { return false; }

// ===== p13_mobs.js =====
// Creatures: their kinds and numbers (from the Swift game through the exporter), drops, spawn rules
// and one creature's state (the Swift game's p13a_mobdefs).

/** every creature kind by key ("zombie"): name, size, health, speed, blows, behaviour, art */
const MOBS = {};
const MOB_BY_ID = [];
for (const m of DATA.mobs) { MOBS[m.key] = m; MOB_BY_ID[m.id] = m; }
const mobDef = (k) => MOBS[k];

const PREDATORS = new Set(["grizzly", "polarBear", "tiger", "scorpion"]);
const WILD_ANIMALS = new Set(["elephant", "bear", "wolf", "grizzly", "polarBear", "tiger", "scorpion"]);
const PREY = new Set(["pig", "cow", "sheep", "chicken", "giraffe", "frog", "cat"]);
const UNDEAD = new Set(["zombie", "skeleton", "archer", "wraith"]);
const HEAT_IMMUNE = new Set(["imp", "emberSlime", "cinderBat", "warden"]);
const BOSS_KINDS = new Set(["bearBoss", "rex", "sentinel", "warden"]);
const isPredator = (k) => PREDATORS.has(k);
const isWildAnimal = (k) => WILD_ANIMALS.has(k);
const isPrey = (k) => PREY.has(k);
const isUndead = (k) => UNDEAD.has(k);
const isHumanoid = (k) => !!MOBS[k].humanoid;
const thinks = (k) => !!MOBS[k].thinks;

/** What a creature drops: [item, least, most, chance] (the Swift game's mobDrops) */
const MOB_DROPS = {
	pig: [["food:rawMeat", 1, 3, 1]],
	cow: [["food:rawMeat", 2, 4, 1], ["mat:leather", 1, 2, 0.8]],
	sheep: [["food:rawMeat", 1, 2, 1], ["mat:wool", 1, 3, 0.9, "wool"]],
	chicken: [["food:rawMeat", 1, 1, 0.9], ["mat:feather", 1, 3, 0.9]],
	crow: [["mat:feather", 1, 2, 0.8]],
	giraffe: [["food:rawMeat", 2, 4, 1], ["mat:leather", 2, 4, 0.9]],
	frog: [["mat:string", 0, 1, 0.1]],
	fish: [["food:rawFish", 1, 1, 1]],
	elephant: [["food:rawMeat", 4, 7, 1], ["mat:tusk", 1, 2, 0.8], ["mat:leather", 2, 4, 0.9]],
	bear: [["food:rawMeat", 2, 4, 1], ["mat:fur", 1, 3, 0.9], ["mat:claw", 1, 1, 0.3]],
	grizzly: [["food:rawMeat", 3, 5, 1], ["mat:fur", 2, 4, 1], ["mat:claw", 1, 2, 0.6]],
	polarBear: [["food:rawMeat", 3, 5, 1], ["mat:fur", 2, 4, 1], ["mat:claw", 1, 2, 0.5]],
	tiger: [["food:rawMeat", 2, 4, 1], ["mat:leather", 1, 3, 0.9], ["mat:claw", 1, 2, 0.6]],

		R.gradH(0, 0, band, H, on, off);
		R.gradH(W - band, 0, band, H, off, on);
	},
};

// ===== u02b_mobs.js =====
// Drawing creatures and fighting (the Swift game's drawMobs, mobFrame, drawProjectiles and the slash
// trails): every creature from its hand-drawn frames, turning, lunging, breathing, flashing when hit
// and toppling when it dies; shots in flight; the player's swings; telegraphed blows; health bars.

/** a creature's frames and how they are used (its variant's art) */
function mobLook(m) {
	const d = m.def, v = d.variants[Math.min(m.variant, d.variants.length - 1)] || d.variants[0];
	return v;
}
const pose = (an, name, fallback) => (an.poses && an.poses[name] !== undefined) ? an.poses[name] : fallback;
function walkFrame(an, t) {
	const w = an.walk;
	if (!w || !w.length) return 0;
	const rate = w.length > 2 ? w.length : 2;
	return w[Math.floor(Math.abs(t) * rate) % w.length];
}
function idleVariant(m, clock) { return ((clock * 0.22 + (m.id % 97) * 0.137) % 1) > 0.74; }
/** which frame a creature shows for what it is doing */
function mobFrame(m, an, clock) {
	const moving = Math.abs(m.b.vx) > 0.3;
	if (isHumanoid(m.kind)) {
		if (m.st === 3) return (m.kind === "pirateGunner" || m.kind === "imp" || m.kind === "archer") ? pose(an, "shoot", 6) : pose(an, "windup", 3);
		if (m.st === 4) return pose(an, "strike", 4);
		if (m.st === 6) return pose(an, "fire", pose(an, "shoot", 6));
		if (m.blocking) return pose(an, "block", 5);
		if (m.atkT > 0 && (m.kind === "zombie" || m.kind === "imp")) return pose(an, "strike", 4);
		return moving ? walkFrame(an, m.anim) : 0;
	}
	switch (m.kind) {
		case "golem":
			if (m.st === 3) return pose(an, "windup", 3);
			if (m.st === 4) return pose(an, "strike", 4);
			if (m.st === 5) return pose(an, "throw", 5);
			return moving ? walkFrame(an, m.anim) : 0;
		case "mimic":
			if (m.st === 3 || m.st === 4) return 3;
			if (!m.b.onGround) return 1 + Math.floor(m.anim * 6) % 2;
			return m.angry ? 1 : 0;
		case "sentinel": case "warden": case "bearBoss": case "rex":
			return moving ? walkFrame(an, m.anim) : Math.floor(m.anim * 1.2) % 2;
	}
	if (an.attack >= 0 && m.atkT > 0) return an.attack;
	if (an.hop) return m.b.onGround ? 0 : an.hopFrame;
	if (an.cycle && an.cycle.length) return an.cycle[Math.floor(m.anim * 1.5) % an.cycle.length];
	if (moving) return walkFrame(an, m.anim);
	if (an.idleAlt >= 0 && m.b.onGround && (m.poseT > 0 || idleVariant(m, clock))) return an.idleAlt;
	return 0;
}

const MobDraw = {
	draw(g) {
		const tp = View.tp, dpr = R.dpr;
		if (g.dangerZones && g.dangerZones.length) this.dangerZones(g);
		for (const m of g.mobs) {
			const dying = m.hp <= 0 && !m.downed;
			if (dying && (m.deathT < 0 || m.removed)) continue;
			if (m.b.x < View.left - 8 - m.b.w || m.b.x > View.left + View.wT + 8 + m.b.w || m.b.y < View.top - 4 || m.b.y - m.b.h > View.top + View.hT + 4) continue;
			const an = mobLook(m);
			const rects = DATA.atlas.rects["mob:" + m.kind + ":" + Math.min(m.variant, m.def.variants.length - 1)];
			if (!rects) continue;
			let left = m.dir < 0, scaleX = 1;
			if (m.turnT > 0 && !dying) {
				const p = 1 - m.turnT / MOB_TURN;
				scaleX = Math.max(0.2, Math.abs(1 - 2 * p));
				if (p < 0.5) left = m.face < 0;
			}
			let drawX = m.b.x;
			if (m.atkT > 0 && !dying && !isBossMob(m)) drawX += m.dir * 0.18 * Math.sin((1 - m.atkT / MOB_ATK) * Math.PI);
			let alpha = m.kind === "wraith" ? 0.82 : 1;
			if (m.downed) alpha = 0.55;
			const shade = Renderer.openShade(g, m.b.x, mobCY(m));
			let rot = m.lean * 0.22, squash = 1;
			if (Math.abs(m.b.vx) < 0.3 && m.b.onGround && !dying) squash = 1 + 0.022 * Math.sin(g.clock * 2.6 + (m.id % 17));
			if (dying) {
				const t = m.deathT;
				if (m.kind === "slime" || m.kind === "emberSlime" || m.def.flying || m.kind === "fish") squash = Math.max(0.2, 1 - t * 1.1);
				else { const f = Math.min(1, t / 0.4); rot = (m.dir > 0 ? -1 : 1) * f * f * 1.45; }
				alpha *= clampD(1 - (t - 0.3) / 0.4, 0, 1);
			}
			const flash = m.flash > 0 || (dying && m.deathT < 0.08);
			const fr = Math.min(mobFrame(m, an, g.clock), rects.length - 1);
			const r = rects[Math.max(0, fr)];
			const scale = an.scale * (m.mutSize || 1);
			this.sprite(r, an.centerCol, an.footRow + 1, scale, drawX, m.b.y, left, Renderer.shadeCol(shade, alpha), flash ? 1 : 0, rot, squash, scaleX);
			if (dying) continue;
			if (m.burn > 0) R.rect(View.sx(bodyLeft(m.b)), View.sy(bodyTop(m.b) + m.b.h * 0.3), m.b.w * tp, m.b.h * 0.7 * tp, rgba(0xFF7020, 0.25 + 0.15 * Math.sin(g.clock * 20)));
			if (m.daze > 0) {
				for (let k = 0; k < 3; k++) {
					const a = g.clock * 6 + k * 2.094, sx = m.b.x + Math.cos(a) * Math.max(0.45, m.b.w * 0.45), sy = bodyTop(m.b) - 0.25 + Math.sin(a) * 0.12;
					const sz = Math.max(3 * dpr, tp * 0.14);
					R.rect(View.sx(sx) - sz * 0.5, View.sy(sy) - sz * 0.5, sz, sz, rgba(k === 1 ? 0xFFFFFF : 0xFFE060));
				}
			}
			if (m.tame) R.oval(View.sx(m.b.x) - 4 * dpr, View.sy(bodyTop(m.b)) - 14 * dpr, 8 * dpr, 8 * dpr, rgba(0xFF5A7A));
			if (!isBossMob(m) && m.hp < m.maxHP && m.hp > 0) {
				const w = Math.max(0.9, m.b.w), bx = m.b.x - w * 0.5, by = bodyTop(m.b) - 0.45;
				R.rect(View.sx(bx), View.sy(by), w * tp, Math.max(2 * dpr, 0.14 * tp), rgba(0, 0.7));
				R.rect(View.sx(bx), View.sy(by), w * tp * (m.hp / m.maxHP), Math.max(2 * dpr, 0.14 * tp), rgba(m.tame ? 0x50E070 : 0xE04040));
			}
		}
	},
	/** one frame from the atlas standing at (x, y) by its anchor column and foot row */
	sprite(r, cx, foot, scale, x, y, left, col, add, rot = 0, squash = 1, scaleX = 1) {
		const px = scale * View.tp;
		if (Math.abs(rot) < 0.01 && Math.abs(squash - 1) < 0.004 && scaleX > 0.999) {
			const cc = left ? r[2] - cx : cx, snap = Math.max(1, px);
			const dx = Math.round((View.sx(x) - cc * px) / snap) * snap, dy = Math.round((View.sy(y) - foot * px) / snap) * snap;
			R.sprite(r[0], r[1], r[2], r[3], dx, dy, r[2] * px, r[3] * px, col, left, add);
			return;
		}
		R.push();
		R.translate(View.sx(x), View.sy(y));
		if (rot) R.rotate(rot);
		R.scale((left ? -1 : 1) * scaleX * (1 + (1 - squash) * 0.5), squash);
		R.sprite(r[0], r[1], r[2], r[3], -cx * px, -foot * px, r[2] * px, r[3] * px, col, false, add);
		R.pop();
	},
	dangerZones(g) {
		for (const z of g.dangerZones) {
			const p = clampD(1 - z.t / z.dur, 0, 1), pulse = 0.5 + 0.5 * Math.sin(g.clock * (10 + 14 * p));
			const x = View.sx(z.x0), y = View.sy(z.y0), w = (z.x1 - z.x0) * View.tp, h = (z.y1 - z.y0) * View.tp;
			R.rect(x, y, w, h, rgba(z.color, 0.08 + 0.08 * pulse));
			R.rect(x, y + h * (1 - p), w, h * p, rgba(z.color, 0.2));
			R.frame(x, y, w, h, 2 * R.dpr, rgba(z.color, 0.5 + 0.3 * pulse));
		}
	},
	projectiles(g) {
		const tp = View.tp, dpr = R.dpr;
		for (const p of g.projectiles) {
			if (p.x < View.left - 2 || p.x > View.left + View.wT + 2 || p.y < View.top - 2 || p.y > View.top + View.hT + 2) continue;
			const x = View.sx(p.x), y = View.sy(p.y);
			const ang = p.stuck > 0 ? p.stuckAngle : Math.atan2(p.vy, p.vx), dx = Math.cos(ang), dy = Math.sin(ang);
			switch (p.kind) {
				case "arrow": case "quarrel": {
					const L = p.kind === "arrow" ? 0.42 : 0.32, hx = dx * tp * L, hy = dy * tp * L, lw = Math.max(2 * dpr, tp / (p.kind === "arrow" ? 11 : 9));
					if (p.stuck <= 0 && (p.trail > 0 || p.kind === "quarrel")) R.line(x - hx - dx * tp * 0.8, y - hy - dy * tp * 0.8, x - hx, y - hy, lw, rgba(0xFFFFFF, 0.18));
					R.line(x - hx, y - hy, x + hx, y + hy, lw, rgba(p.kind === "arrow" ? 0x8A5A2A : 0x6A4A26));
					R.line(x + hx * 0.6, y + hy * 0.6, x + hx * 1.08, y + hy * 1.08, lw + dpr, rgba(p.kind === "arrow" ? 0xD0D0D8 : 0xC89040));
					if (p.kind === "arrow") { const nx = -dy * tp * 0.12, ny = dx * tp * 0.12; R.line(x - hx, y - hy, x - hx * 0.6 + nx, y - hy * 0.6 + ny, lw, rgba(0xE8E0D0)); R.line(x - hx, y - hy, x - hx * 0.6 - nx, y - hy * 0.6 - ny, lw, rgba(0xE8E0D0)); }
					break;
				}
				case "bullet": R.line(x - dx * tp * 0.6, y - dy * tp * 0.6, x, y, 2 * dpr, rgba(0xFFE8A0, 0.4)); R.rect(x - 2 * dpr, y - 2 * dpr, 4 * dpr, 4 * dpr, rgba(0xFFF2C0)); break;
				case "pellet": R.line(x - dx * tp * 0.5, y - dy * tp * 0.5, x, y, 2 * dpr, rgba(0xFFE8A0, 0.35)); R.rect(x - 1.5 * dpr, y - 1.5 * dpr, 3 * dpr, 3 * dpr, rgba(0xFFF2C0)); break;
				case "pebble": case "rock": {
					const sz = Math.max(4 * dpr, p.w * tp), h = sz * 0.5;
					R.rect(x - h, y - h, sz, sz, rgba(0x8A8A8A)); R.rect(x - h, y - h, sz * 0.5, sz * 0.45, rgba(0xB0B0B0));
					break;
				}
				case "fireball": {
					const r = tp * 0.3 * (0.9 + 0.1 * Math.sin(g.clock * 30));
					R.oval(x - r * 1.6, y - r * 1.6, r * 3.2, r * 3.2, rgba(0xFF7020, 0.25));
					R.oval(x - r, y - r, r * 2, r * 2, rgba(0xFF9A30));
					R.oval(x - r * 0.5, y - r * 0.5, r, r, rgba(0xFFE8A0));
					break;
				}
				case "bomb": {
					const r = tp * 0.22;
					R.oval(x - r, y - r, r * 2, r * 2, rgba(0x2A2A30));
					R.oval(x - r * 0.5, y - r * 0.7, r * 0.6, r * 0.6, rgba(0x6A6A78));
					if (Math.floor(p.life * 12) % 2 === 0) R.rect(x + r * 0.2, y - r * 1.6, 3 * dpr, 3 * dpr, rgba(0xFFD040));
					break;
				}
				case "shock": R.rect(x - tp * 0.4, y - tp * 0.15, tp * 0.8, tp * 0.3, rgba(0xA08860, 0.5)); break;
			}
		}
	},
	slashes(g) {
		if (!g.slashes) return;
		const tp = View.tp, dpr = R.dpr;
		for (const s of g.slashes) {
			const a = clampD(s.life / s.maxLife, 0, 1), col = rgba(artGrade(s.color), 0.55 * a), x = View.sx(s.x), y = View.sy(s.y), r = s.reach * tp;
			if (s.style === "thrust" || s.style === "stab") {
				const dx = Math.cos(s.ang), dy = Math.sin(s.ang);
				R.line(x + dx * r * 0.3, y + dy * r * 0.3, x + dx * r, y + dy * r, Math.max(3 * dpr, tp * 0.14), col);
				continue;
			}
			const n = 9, a0 = s.ang - s.halfArc, a1 = s.ang + s.halfArc;

				if (t1 > sweep + 0.6) break;
				const b0 = a0 + (a1 - a0) * t0, b1 = a0 + (a1 - a0) * t1, rr = r * 0.92;
				R.line(x + Math.cos(b0) * rr, y + Math.sin(b0) * rr, x + Math.cos(b1) * rr, y + Math.sin(b1) * rr, Math.max(2 * dpr, tp * 0.12 * (1 - Math.abs(t0 - 0.5))), col);

	},
	/** the dotted flight of a drawn bow (or a sling, a crossbow, a bomb) */
	aimArc(g) {
		const pts = g.arrowPreview();
		if (!pts) return;
		const s = Math.max(3, View.tp * 0.12);
		for (let i = 0; i < pts.length; i += 2) {
			const a = 0.75 * (1 - i / pts.length);
			R.rect(View.sx(pts[i]) - s * 0.5, View.sy(pts[i + 1]) - s * 0.5, s, s, rgba(0xFFFFFF, a));
		}
	},
	muzzle(g) {
		if (!(g.muzzleT > 0)) return;
		const x = View.sx(g.pb.x + g.facing * 0.9), y = View.sy(g.pb.y - 1.2), r = View.tp * 0.3;
		R.oval(x - r, y - r, r * 2, r * 2, rgba(0xFFE080, 0.8));
	},
};
drawHooksMid.push((g) => MobDraw.draw(g));
drawHooksFront.push((g) => { MobDraw.projectiles(g); MobDraw.slashes(g); MobDraw.muzzle(g); MobDraw.aimArc(g); });

// ===== u03_hud.js =====
// The HUD and the controls (the Swift game's u03_hud and p14c_input): hearts, food and air, the hotbar,
// the walking stick and JUMP on touch screens, the keyboard and mouse, floating text and messages.
// The HUD is HTML laid over the world's canvas; icons come from the same art sheet as the world.

const $ = (id) => document.getElementById(id);

/** the style that shows an atlas picture [x, y, w, h] fitted into a box `size` pixels high */
function iconStyle(r, size) {
	const k = size / Math.max(r[2], r[3]);
	return "width:" + (r[2] * k) + "px;height:" + (r[3] * k) + "px;background-size:" + (Atlas.w * k) + "px " + (Atlas.h * k) + "px;background-position:-" + (r[0] * k) + "px -" + (r[1] * k) + "px";
}
function iconHTML(id, size) { return '<span class="ic" style="' + iconStyle(iconRect(id), size) + '"></span>'; }
function slotSizePx() { return Math.min(54, (window.innerWidth - 36) / 10); }
function escapeHTML(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
/** a bag slot's inside: the icon and the count */
function slotInner(s, size, key = "") {
	if (!s) return key ? '<span class="k">' + key + "</span>" : "";
	const gd = itemDef(s.id).gun;
	const n = gd ? '<span class="n" style="color:#ffe080">' + s.extra + "</span>" : s.n > 1 ? '<span class="n">' + s.n + "</span>" : "";
	return (key ? '<span class="k">' + key + "</span>" : "") + iconHTML(s.id, size * 0.66) + n;
}

const HUD = {

	initStick() {

	initWorldPointer() {

					// a second finger: the first one's dig or build stops, and the two pinch the view

					if (touches.size === 2) pinch = { d0: Math.max(20, spread()), px0: g.settings.tilePx };
					return;
				}
			}
			if (g.dead || UI.aimPointer !== -1) return;
			if (e.pointerType === "mouse" && e.button !== 0) return;
			UI.aimPointer = e.pointerId; UI.mouse = e.pointerType === "mouse";
			cv.setPointerCapture(e.pointerId);
			UI.aimSX = e.clientX; UI.aimSY = e.clientY;
			const [wx, wy] = this.toWorld(e.clientX, e.clientY);
			g.pointerDown(wx, wy);
		});
		cv.addEventListener("pointermove", (e) => {
			const g = UI.game;
			if (!g) return;
			if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
			if (pinch && touches.size >= 2) { setZoom(pinch.px0 * spread() / pinch.d0, false); return; }
			if (e.pointerId === UI.aimPointer) {
				UI.aimSX = e.clientX; UI.aimSY = e.clientY;
				const [wx, wy] = this.toWorld(e.clientX, e.clientY);
				g.pointerMove(wx, wy);
			} else if (e.pointerType === "mouse" && UI.aimPointer === -1 && !UI.panelOpen) {
				// a mouse shows where a block would go before the click
				UI.mouse = true; UI.aimSX = e.clientX; UI.aimSY = e.clientY;
				const [wx, wy] = this.toWorld(e.clientX, e.clientY);
				g.aimX = wx; g.aimY = wy; g.aimValid = true;

		});
		const end = (e) => {
			touches.delete(e.pointerId);

			if (e.pointerId !== UI.aimPointer) return;
			UI.aimPointer = -1;

		cv.addEventListener("contextmenu", (e) => e.preventDefault());
		cv.addEventListener("wheel", (e) => {

		// Safari's own pinch gestures would zoom the whole page
		for (const ev of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(ev, (e) => e.preventDefault());
	},
	initKeys() {
		const set = (e, on) => {
			const g = UI.game;
			if (!g) return false;
			if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return false;
			switch (e.code) {
				case "KeyA": case "ArrowLeft": g.keyL = on; return true;
				case "KeyD": case "ArrowRight": g.keyR = on; return true;
				case "KeyW": case "ArrowUp": case "Space": g.jumpHeld = on; return true;
				case "KeyS": case "ArrowDown": g.downHeld = on; return true;
			}
			return false;
		};
		window.addEventListener("keydown", (e) => {
			Sound.unlock();
			const g = UI.game;
			if (!g) return;
			if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
			if (e.code === "Escape") { e.preventDefault(); if (UI.panelOpen) closePanels(); else openPause(); return; }
			if (e.code === "KeyE" || e.code === "Tab" || e.code === "KeyI") { e.preventDefault(); if (UI.panelOpen === "inventory") closePanels(); else if (!UI.panelOpen) openPanel("inventory", g.isCreative ? "items" : "bag"); return; }
			if (UI.panelOpen) return;
			if (set(e, true)) { e.preventDefault(); return; }
			if (/^Digit[0-9]$/.test(e.code)) { const d = +e.code.slice(5); g.setSel(d === 0 ? 9 : d - 1); return; }
			if (e.code === "KeyQ") { g.dropSlot(g.sel, e.shiftKey); return; }
			if (e.code === "KeyF" && !e.shiftKey) { ActStick.held = true; return; }
			if (e.code === "KeyR") { g.cycleWeapon(); return; }
			if (e.code === "KeyF" && e.shiftKey && g.isCreative) { g.flying = !g.flying; g.say(g.flying ? "Flying" : "Walking", 1); return; }
			if (e.code === "Equal" || e.code === "NumpadAdd") setZoom(g.settings.tilePx * 1.12);
			if (e.code === "Minus" || e.code === "NumpadSubtract") setZoom(g.settings.tilePx / 1.12);
		});
		window.addEventListener("keyup", (e) => { set(e, false); if (e.code === "KeyF") ActStick.release(); });
		window.addEventListener("blur", () => releaseAllInput());
	},
	/** every frame: the aim follows the finger as the view moves, the HUD shows what changed */
	update(g) {

		if (UI.aimPointer !== -1 || UI.mouse) {

		}
		const key = g.hudRev + "|" + Math.ceil(g.hp * 2) + "|" + Math.ceil(g.hunger * 2) + "|" + Math.ceil(g.air) + "|" + g.sel + "|" + g.mode + "|" + g.maxHP;
		if (key !== UI.hudKey) { UI.hudKey = key; this.redraw(g); }
		this.drawFloats(g);

			perf.classList.remove("hidden");
			if ((Loop.frames & 15) === 0) perf.textContent = Math.round(Loop.fps) + " fps  tick " + g.tickMs.toFixed(1) + " ms  draw " + PERF.renderMs.toFixed(1) + " ms\nx " + Math.floor(g.pb.x) + "  y " + Math.floor(g.pb.y) + "  chunks " + g.world.chunks.size + "  light " + PERF.lightMs.toFixed(1) + " ms";
		} else perf.classList.add("hidden");
	},
	redraw(g) {
		const hb = $("hotbar").children, size = slotSizePx();
		for (let i = 0; i < HOTBAR_N; i++) {
			const el = hb[i];

			el.innerHTML = slotInner(g.inv.slots[i], size, size > 44 ? String((i + 1) % 10) : "");
		}
		const creative = g.isCreative;
		const pips = (full, empty, value, count) => {
			let h = "";

			for (let i = 0; i < count; i++) {
				const v = clampD(value - i * 2, 0, 2);
				h += '<span style="position:relative;display:inline-block;width:18px;height:18px"><span class="ic" style="position:absolute;' + iconStyle(re, 18) + '"></span>';
				if (v > 0) h += '<span style="position:absolute;left:0;top:0;width:' + (v >= 2 ? 18 : 9) + 'px;height:18px;overflow:hidden"><span class="ic" style="position:absolute;' + iconStyle(rf, 18) + '"></span></span>';
				h += "</span>";

			return h;
		};
		$("hearts").innerHTML = creative ? "" : pips("misc:heart_full", "misc:heart_empty", Math.ceil(g.hp), Math.ceil(g.maxHP / 2));
		$("food").innerHTML = creative ? "" : pips("misc:food_full", "misc:food_empty", Math.ceil(g.hunger), 10);
		let air = "";
		if (g.air < 9.95 && !creative) { const rb = spriteRect("misc:bubble"); for (let i = 0; i < Math.ceil(g.air); i++) air += '<span class="ic" style="margin-right:2px;' + iconStyle(rb, 16) + '"></span>'; }
		$("air").innerHTML = air;
		const m = $("msg");

	drawFloats(g) {
		const els = UI.floatEls, k = View.tp / R.dpr;

			const el = els[i], f = g.floats[i];
			if (!f) { if (!el.classList.contains("hidden")) el.classList.add("hidden"); continue; }
			el.classList.remove("hidden");
			if (el.textContent !== f.text) el.textContent = f.text;
			el.style.left = ((f.x - View.left) * k) + "px";
			el.style.top = ((f.y - View.top) * k) + "px";

			el.style.color = hexCss(f.color);
		}
	},
};
/** lets go of every control (a panel opened over them, the page lost focus) */
function releaseAllInput() {

/** how big the blocks are on screen: pinching, the + and - buttons, the settings slider, Ctrl+wheel */
const ZOOM_MIN = 12, ZOOM_MAX = 72;
function setZoom(px, save = true) {
	const g = UI.game;
	if (!g) return;

// ===== u04_panels.js =====
// The panels (the Swift game's u04_panels): the bag with armour, the crafting book with live counts,
// chests, the creative item browser, the pause screen with settings, and the death screen.

const Panel = {
	tab: "bag", pick: -1, pickArmor: -1, info: null, cat: "all", canOnly: false, search: "", key: "",
	el() { return $("panel"); },
};

/** opens a panel over the game; the controls let go so nothing keeps walking or mining underneath */
function openPanel(name, tab) {
	const g = UI.game;
	if (!g) return;
	releaseAllInput();
	UI.panelOpen = name;
	if (tab) Panel.tab = tab;
	else if (g.openChest) Panel.tab = "bag";
	else if (Panel.tab === "items" && !g.isCreative) Panel.tab = "bag";
	Panel.pick = -1; Panel.pickArmor = -1; Panel.info = null;
	$("panel").classList.remove("hidden");
	HUD.show(false);
	renderPanel(true);
}
function closePanels() {
	const g = UI.game;
	UI.panelOpen = null;
	$("panel").classList.add("hidden");
	$("pause").classList.add("hidden");
	if (g) { g.openChest = null; g.craftStation = "hand"; g.paused = false; HUD.show(!g.dead); UI.hudKey = ""; }
}

function renderPanel(force = false) {
	const g = UI.game;
	if (!g || UI.panelOpen !== "inventory") return;
	const key = Panel.tab + "|" + g.hudRev + "|" + Panel.pick + "|" + Panel.pickArmor + "|" + Panel.cat + "|" + Panel.canOnly + "|" + Panel.search + "|" + (g.openChest ? g.openChest.x + "," + g.openChest.y : "");
	if (!force && key === Panel.key) return;
	if (!force && document.activeElement && document.activeElement.id === "isearch") return;
	Panel.key = key;
	const box = $("panel");
	const scrollEl = box.querySelector(".scroll");
	const keepScroll = scrollEl ? scrollEl.scrollTop : 0;
	const tabs = [["bag", g.openChest ? "CHEST" : "BAG"], ["craft", "CRAFT"]];
	if (g.isCreative) { tabs.push(["items", "ITEMS"]); tabs.push(["mobs", "CREATURES"]); }
	let top = '<div class="top"><span class="title">' + (Panel.tab === "craft" ? "Crafting" : Panel.tab === "items" ? "All items" : Panel.tab === "mobs" ? "Creatures" : g.openChest ? "Chest" : "Inventory") + '</span><div class="tabs">';
	for (const [k, n] of tabs) top += '<button data-tab="' + k + '" class="' + (Panel.tab === k ? "on" : "") + '">' + n + "</button>";
	top += '</div><button data-act="close">✕</button></div>';
	let body = "";
	if (Panel.tab === "craft") body = craftHTML(g);
	else if (Panel.tab === "items") body = itemsHTML(g);
	else if (Panel.tab === "mobs") body = mobsHTML(g);
	else body = bagHTML(g);
	box.innerHTML = '<div class="box">' + top + '<div class="scroll">' + body + "</div></div>";
	const sc = box.querySelector(".scroll");
	if (sc) sc.scrollTop = keepScroll;
}

function gridHTML(slots, from, to, prefix, size, chosen) {
	let h = '<div class="grid">';
	for (let i = from; i < to; i++) h += '<div class="slot' + (chosen === i ? " pick" : "") + (prefix === "s" && i === UI.game.sel ? " sel" : "") + '" data-' + prefix + '="' + i + '">' + slotInner(slots[i], size) + "</div>";
	return h + "</div>";
}
function bagHTML(g) {
	const size = slotSizePx();
	let h = "";
	if (g.openChest) {
		const items = g.world.chestItems(g.openChest.x, g.openChest.y);
		const shown = items.slice(0, 27);
		while (shown.length < 30) shown.push(null);
		h += '<div class="label">Chest — tap to take</div>' + gridHTML(shown, 0, 30, "c", size, -1);
		h += '<div class="label">Your bag — tap to put in the chest</div>';
	} else {
		h += '<div class="label">Armour and gear</div><div class="armor">';
		const names = ["Head", "Chest", "Legs", "Gear", "Gear"];
		for (let i = 0; i < ARMOR_N; i++) {
			const s = g.inv.armor[i];
			h += '<div class="slot' + (Panel.pickArmor === i ? " pick" : "") + '" data-a="' + i + '">' + (s ? slotInner(s, size) : '<span class="k" style="position:static;font-size:10px">' + names[i] + "</span>") + "</div>";
		}
		h += '</div><div style="text-align:center;font-size:13px;color:var(--dim);margin-top:4px">Defence ' + g.inv.defense.toFixed(1) + " — blows " + Math.round(g.armorShare(g.inv.defense) * 100) + "% softer</div>";
		h += '<div class="label">Hotbar</div>';
	}
	h += gridHTML(g.inv.slots, 0, HOTBAR_N, "s", size, Panel.pick);
	if (!g.openChest) h += '<div class="label" style="display:flex;align-items:center;gap:8px">Bag <button data-act="sort" style="margin-left:auto;padding:4px 10px;font-size:13px">SORT</button></div>';
	else h += '<div style="height:6px"></div>';
	h += gridHTML(g.inv.slots, HOTBAR_N, BAG_N, "s", size, Panel.pick);
	h += infoHTML(g);
	return h;
}
function infoHTML(g) {
	let s = null, where = "";
	if (Panel.pick >= 0) { s = g.inv.slots[Panel.pick]; where = "bag"; }
	else if (Panel.pickArmor >= 0) { s = g.inv.armor[Panel.pickArmor]; where = "armor"; }
	if (!s) return '<div class="info"><div class="ln">Tap an item to see it. Tap another slot to move it there.</div></div>';
	const d = itemDef(s.id);
	let h = '<div class="info"><div class="nm">' + iconHTML(s.id, 22) + " " + escapeHTML(d.name) + (s.n > 1 ? " ×" + s.n : "") + "</div>";
	for (const ln of d.info || []) h += '<div class="ln">' + escapeHTML(ln) + "</div>";
	h += '<div class="acts">';
	if (where === "armor") h += '<button data-act="unequip">TAKE OFF</button>';
	else {
		if (s.id.startsWith("armor:") || s.id.startsWith("gear:")) h += '<button data-act="equip" class="primary">PUT ON</button>';
		if (s.id.startsWith("food:")) h += '<button data-act="eat" class="primary">EAT</button>';
		if (Panel.pick >= HOTBAR_N) h += '<button data-act="tohot">TO HOTBAR</button>';
		else h += '<button data-act="hold">HOLD</button>';
		h += '<button data-act="drop1">DROP 1</button><button data-act="dropall" class="warn">DROP ALL</button>';
		if (g.isCreative) h += '<button data-act="trash" class="warn">BIN</button>';
	}
	return h + "</div></div>";
}
function recipeList(g) {
	const q = Panel.search.trim().toLowerCase();
	return RECIPES.filter((r) => {
		if (Panel.cat !== "all" && r.cat !== Panel.cat) return false;
		if (q && !itemName(r.out).toLowerCase().includes(q)) return false;
		if (Panel.canOnly && !(g.stationAvailable(r.station) && g.craftableCount(r) > 0)) return false;
		return true;
	});
}
function craftHTML(g) {
	const st = g.craftStation;
	let h = '<div style="font-size:14px;color:var(--dim);margin-bottom:6px">' + (st !== "hand" ? "At the " + STATION_NAMES[st] + ". " : "") + "Stations within a few blocks count.</div>";
	h += '<div class="tabs" style="margin-bottom:8px"><button data-cat="all" class="' + (Panel.cat === "all" ? "on" : "") + '">ALL</button>';
	const cats = RECIPE_CATS.filter((c) => RECIPES.some((r) => r.cat === c));
	for (const c of cats) h += '<button data-cat="' + c + '" class="' + (Panel.cat === c ? "on" : "") + '">' + CAT_NAMES[c].toUpperCase() + "</button>";
	h += "</div>";
	h += '<div style="display:flex;gap:6px;margin-bottom:8px"><input id="isearch" placeholder="Search" value="' + escapeHTML(Panel.search) + '" style="flex:1"><button data-act="canonly" class="' + (Panel.canOnly ? "on" : "") + '">CAN MAKE</button></div>';
	return h + '<div id="plist">' + craftListHTML(g) + "</div>";
}
function craftListHTML(g) {
	let h = "";
	const list = recipeList(g);
	// what can be made now comes first
	const can = [], cannot = [];
	for (const r of list) { if (g.stationAvailable(r.station) && g.craftableCount(r) > 0) can.push(r); else cannot.push(r); }
	if (!list.length) h += '<div class="note">Nothing here.</div>';
	for (const r of can.concat(cannot)) {
		const stOK = g.stationAvailable(r.station), n = g.craftableCount(r);
		const ok = stOK && n > 0;
		h += '<div class="recipe' + (ok ? "" : " no") + '">' + iconHTML(r.out, 30) + '<div class="nm">' + escapeHTML(itemName(r.out)) + (r.n > 1 ? " ×" + r.n : "") + '<div class="cost">';
		for (const c of r.cost) {
			const have = g.inv.total(c[0]);
			h += '<span class="' + (have >= c[1] || g.isCreative ? "" : "miss") + '">' + iconHTML(c[0], 16) + " " + have + "/" + c[1] + "</span>";
		}
		if (r.station !== "hand") h += '<span class="' + (stOK ? "" : "miss") + '">' + STATION_NAMES[r.station] + "</span>";

/** creative: any creature, put down a few blocks in front of the player */
function mobsHTML(g) {

	for (const d of DATA.mobs) {

}
function itemsListHTML(g) {
	const size = slotSizePx(), q = Panel.search.trim().toLowerCase();
	let h = '<div class="grid">';
	for (const id of ITEM_LIST) {
		if (q && !itemName(id).toLowerCase().includes(q) && !id.toLowerCase().includes(q)) continue;
		h += '<div class="slot" data-give="' + escapeHTML(id) + '">' + iconHTML(id, size * 0.66) + "</div>";
	}

}
function itemsHTML(g) {
	const size = slotSizePx();
	let h = '<div style="display:flex;gap:6px;margin-bottom:8px"><input id="isearch" placeholder="Search all items" value="' + escapeHTML(Panel.search) + '" style="flex:1"></div>';
	h += '<div class="label">Tap to take a stack</div><div id="plist">' + itemsListHTML(g) + "</div>";
	h += '<div class="label">Hotbar</div>' + gridHTML(g.inv.slots, 0, HOTBAR_N, "s", size, Panel.pick);

/** a tap on a slot: pick it, or move the picked stack there (merging, or swapping) */
function slotTap(g, i) {
	if (g.openChest) { g.chestStore(g.openChest.x, g.openChest.y, i); sfx("tap", 0.3); return; }
	if (Panel.pickArmor >= 0) {
		const a = Panel.pickArmor, s = g.inv.slots[i];
		Panel.pickArmor = -1;
		if (!s) { g.inv.slots[i] = g.inv.armor[a]; g.inv.armor[a] = null; }
		else if (fitsArmor(s.id, a)) { const old = g.inv.armor[a]; g.inv.armor[a] = s; g.inv.slots[i] = old; }
		g.bumpHUD();
		return;
	}
	if (Panel.pick < 0 || Panel.pick === i) { Panel.pick = Panel.pick === i ? -1 : i; return; }
	const a = g.inv.slots[Panel.pick], b = g.inv.slots[i];
	if (a && b && a.id === b.id && sameInf(a.inf, b.inf) && b.n < maxStack(b.id)) {
		const put = Math.min(maxStack(b.id) - b.n, a.n);
		b.n += put; a.n -= put;
		if (a.n <= 0) g.inv.slots[Panel.pick] = null;
	} else g.inv.swap(Panel.pick, i);
	Panel.pick = -1;
	sfx("tap", 0.3);
	g.bumpHUD();
}
function fitsArmor(id, slot) {
	if (slot < FIRST_GEAR) return id.startsWith("armor:" + ARMOR_SLOTS[slot] + ":");
	return id.startsWith("gear:");
}
function armorTap(g, a) {
	if (Panel.pick >= 0) {
		const s = g.inv.slots[Panel.pick];
		if (s && fitsArmor(s.id, a)) { const old = g.inv.armor[a]; g.inv.armor[a] = s; g.inv.slots[Panel.pick] = old; sfx("equip", 0.5); g.bumpHUD(); }
		else g.say("That doesn't go there.", 1.2);
		Panel.pick = -1;
		return;
	}
	Panel.pickArmor = Panel.pickArmor === a ? -1 : (g.inv.armor[a] ? a : -1);
}
function panelAct(g, act) {
	const i = Panel.pick;
	switch (act) {
		case "close": closePanels(); return;
		case "sort": g.inv.sortBag(); sfx("tap", 0.3); break;
		case "equip": if (i >= 0) { g.quickEquip(i); Panel.pick = -1; } break;
		case "unequip": if (Panel.pickArmor >= 0) { g.unequip(Panel.pickArmor); Panel.pickArmor = -1; } break;
		case "eat": if (i >= 0) { const old = g.sel; g.sel = i; g.useFood(g.inv.slots[i].id, true); g.sel = old; } break;
		case "tohot": if (i >= 0) { for (let k = 0; k < HOTBAR_N; k++) if (!g.inv.slots[k]) { g.inv.swap(i, k); Panel.pick = k; break; } if (Panel.pick === i) { g.inv.swap(i, g.sel); Panel.pick = g.sel; } } break;
		case "hold": if (i >= 0 && i < HOTBAR_N) g.setSel(i); break;
		case "drop1": if (i >= 0) g.dropSlot(i, false); break;
		case "dropall": if (i >= 0) { g.dropSlot(i, true); Panel.pick = -1; } break;
		case "trash": if (i >= 0) { g.inv.slots[i] = null; Panel.pick = -1; } break;

}
function initPanels() {

		}
		else if (ds.give) { const left = g.inv.add(ds.give, maxStack(ds.give)); if (left > 0) g.say("Your bag is full.", 1.2); else sfx("pickup", 0.4); g.bumpHUD(); }
		renderPanel(true);

	box.addEventListener("input", (e) => {

	$("death").addEventListener("click", (e) => {

}
