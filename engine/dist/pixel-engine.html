// ===== p19_save.js =====
// Saving and loading (the Swift game's p19_save). A world is saved as the changes to its chunks (each
// changed chunk against the same chunk made fresh), the player, the bag, chests and the clock, packed
// and squeezed into text. The text goes to the viewer's own space in their account when the page can
// reach it, or to this browser, and can be exported as a file.

const SAVE_VERSION = 1;
const PART = 200000;          // characters a stored document holds (well under the 256 KB limit)

const SettingsStore = {
	key: "pixelrealm.settings",
	load() {
		const s = defaultSettings();
		try { const t = localStorage.getItem(this.key); if (t) Object.assign(s, JSON.parse(t)); } catch (e) {}
		return s;
	},
	save(s) { try { localStorage.setItem(this.key, JSON.stringify(s)); } catch (e) {} },
};

function bytesToB64(u8) {
	let s = "";
	for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
	return btoa(s);
}
function b64ToBytes(s) {
	const bin = atob(s), out = new Uint8Array(bin.length);
	for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
	return out;
}
async function squeeze(u8, way) {
	const cs = new CompressionStream(way);
	const buf = await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer();
	return new Uint8Array(buf);
}
async function unsqueeze(u8, way) {
	const ds = new DecompressionStream(way);
	const buf = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
	return new Uint8Array(buf);
}
/** an object as text: JSON, deflated where the browser can, in base64; the first letters say which */
async function packText(obj) {
	const raw = new TextEncoder().encode(JSON.stringify(obj));
	if (typeof CompressionStream !== "undefined") {
		try { return "PRD1:" + bytesToB64(await squeeze(raw, "deflate")); } catch (e) {}
	}
	return "PRJ1:" + bytesToB64(raw);
}
async function unpackText(text) {
	text = text.trim();
	const kind = text.slice(0, 5), body = text.slice(5);
	let raw;
	if (kind === "PRD1:") {
		if (typeof DecompressionStream === "undefined") throw new Error("this browser cannot read squeezed saves");
		raw = await unsqueeze(b64ToBytes(body), "deflate");
	} else if (kind === "PRJ1:") raw = b64ToBytes(body);
	else if (text.startsWith("{")) return JSON.parse(text);
	else throw new Error("this is not a PixelRealm world");
	return JSON.parse(new TextDecoder().decode(raw));
}

// ---- a world as an object
function chunkDelta(gen, dim, ch) {
	const base = generateChunk(gen, dim, ch.cx).tiles, t = ch.tiles;
	const d = new Uint8Array(t.length);
	let any = false;
	for (let i = 0; i < t.length; i++) if (t[i] !== base[i]) { d[i] = t[i] + 1; any = true; }
	return any ? bytesToB64(rle(d)) : "";
}
function makeSave(g) {
	const w = g.world, chunks = [];
	const each = (dim, ch) => {
		if (!ch.dirty) return;
		chunks.push([dim, ch.cx, chunkDelta(g.gen, dim, ch), ch.walls ? bytesToB64(rle(ch.walls)) : "", ch.built ? bytesToB64(rle(ch.built)) : ""]);
	};
	for (const ch of w.chunks.values()) each(w.dim, ch);
	for (let d = 0; d < w.parked.length; d++) for (const ch of w.parked[d].values()) each(d, ch);
	const chests = [];
	for (const [k, items] of w.chests) chests.push([k, items]);
	const pb = g.pb;
	const o = {
		v: SAVE_VERSION, name: g.worldName, mode: g.mode, seed: g.seedValue, infinite: g.gen.infinite, genVersion: g.gen.genVersion,
		options: g.gen.options, rareChance: g.gen.rareChance, dim: w.dim,
		time: g.timeOfDay, day: g.dayCount, play: Math.floor(g.playSeconds), saved: new Date().toISOString(),
		player: { x: pb.x, y: pb.y, hp: g.hp, maxHP: g.maxHP, hunger: g.hunger, air: g.air, spawnX: g.spawnX, spawnY: g.spawnY, sel: g.sel, facing: g.facing, dead: g.dead, over: g.hardcoreOver },
		inv: g.inv.toJSON(), chunks, chests, journal: g.journal,
	};
	saveHooks.forEach((f) => f(g, o));
	return o;
}
/** makes the game a save describes; the land comes from the save, not made around the spawn first */
function loadSave(o, settings) {
	if (!o || typeof o.seed !== "number") throw new Error("the save has no world in it");
	if (o.v > SAVE_VERSION) throw new Error("this world was saved by a newer version");
	const g = new Game(o.mode | 0, !!o.infinite, o.seed >>> 0, settings, o.genVersion || GEN_VERSION, o.options || null, false);
	g.gen.rareChance = o.rareChance !== undefined ? o.rareChance : g.gen.rareChance;
	g.worldName = o.name || "World";
	g.timeOfDay = o.time || 0.06; g.dayCount = o.day || 0; g.playSeconds = o.play || 0;
	const w = g.world, H = w.H;
	for (const c of o.chunks || []) {
		const [dim, cx, delta, walls, built] = c;
		const ch = generateChunk(g.gen, dim, cx);
		if (delta) {
			const d = unrle(b64ToBytes(delta), chunkW * H);
			for (let i = 0; i < d.length; i++) if (d[i] !== 0) ch.tiles[i] = d[i] - 1;
		}
		if (walls) ch.walls = unrle(b64ToBytes(walls), chunkW * H);
		if (built) ch.built = unrle(b64ToBytes(built), chunkW * H);
		for (let lx = 0; lx < chunkW; lx++) ch.recomputeSky(lx);
		if (ch.stairs >= 0) { ch.stairs = 0; for (let i = 0; i < ch.tiles.length; i++) if (STAIR[ch.tiles[i]]) ch.stairs++; }
		ch.dirty = true;
		ch.bumpRows(0, H - 1);
		if (dim >= 0 && dim < w.parked.length) w.parked[dim].set(cx, ch);
	}
	w.chests.clear();
	for (const [k, items] of o.chests || []) w.chests.set(k, (items || []).map((s) => stack(s.id, s.n, s.extra || 0, s.inf || null)));
	w.dim = o.dim || Dimension.overworld;
	const p = o.player || {};
	g.inv = Inventory.from(o.inv);
	g.maxHP = p.maxHP || rule("health");
	g.hp = p.hp !== undefined ? p.hp : g.maxHP; g.hunger = p.hunger !== undefined ? p.hunger : 20; g.air = p.air !== undefined ? p.air : 10;
	g.spawnX = p.spawnX !== undefined ? p.spawnX : g.gen.spawnX + 0.5;
	g.sel = clampI(p.sel || 0, 0, HOTBAR_N - 1); g.facing = p.facing || 1;
	g.hardcoreOver = !!p.over;
	g.journal = Object.assign({ crafted: [], relics: 0 }, o.journal || {});
	const px = p.x !== undefined ? p.x : g.gen.spawnX + 0.5;
	w.loadAround(Math.floor(px), 5);
	g.spawnY = p.spawnY !== undefined ? p.spawnY : w.surfaceY(Math.floor(g.spawnX));
	g.pb.x = px; g.pb.y = p.y !== undefined ? p.y : w.surfaceY(Math.floor(px));
	g.pb.vx = 0; g.pb.vy = 0;
	if (p.dead || g.hp <= 0) { if (g.mode === GameMode.hardcore && g.hardcoreOver) g.dead = true; else { g.hp = 1; g.respawn(); } }
	g.camX = g.pb.x; g.camY = g.pb.y - 2; g.camTX = g.camX; g.camTY = g.camY;
	loadHooks.forEach((f) => f(g, o));
	g.bumpHUD();
	return g;
}

// ---- where saves are kept
const Store = {
	db: null, uid: null, dl: null, ready: null,
	init() {
		if (this.ready) return this.ready;
		this.ready = (async () => {
			try {
				const c = window.claude;
				if (!c || !c.use) return;
				const got = await Promise.all([c.use("db").catch(() => null), c.use("user").catch(() => null), c.use("downloads").catch(() => null)]);
				this.dl = got[2] || null;
				if (got[0] && got[1]) { const id = await got[1].id(); if (id) { this.db = got[0]; this.uid = id; } }
			} catch (e) { this.db = null; }
		})();
		return this.ready;
	},
	get where() { return this.db ? "your account" : "this browser"; },
	col() { return this.db.collection("data/users/" + this.uid); },
	async list() {
		await this.init();
		let list = [];
		if (this.db) { try { const d = await this.col().doc("worlds").get(); if (d.exists) list = d.data().list || []; } catch (e) {} }
		try { const t = localStorage.getItem("pixelrealm.worlds"); if (t) for (const w of JSON.parse(t)) if (!list.some((o) => o.id === w.id)) { w.local = true; list.push(w); } } catch (e) {}
		list.sort((a, b) => (b.saved || "").localeCompare(a.saved || ""));
		return list;
	},
	async setIndex(entry, remove = false) {
		if (this.db && !entry.local) {
			const ref = this.col().doc("worlds");
			const d = await ref.get();
			let list = d.exists ? (d.data().list || []) : [];
			list = list.filter((o) => o.id !== entry.id);
			if (!remove) list.push(entry);
			await ref.set({ list });
			return;
		}
		let list = [];
		try { list = JSON.parse(localStorage.getItem("pixelrealm.worlds") || "[]"); } catch (e) {}
		list = list.filter((o) => o.id !== entry.id);
		if (!remove) list.push(entry);
		localStorage.setItem("pixelrealm.worlds", JSON.stringify(list));
	},
	/** writes the text into the slot not in use, then points the world's head at it, so a break half way keeps the old save whole */
	async write(id, text, entry) {
		await this.init();
		if (this.db) {
			try {
				const col = this.col(), head = col.doc("w_" + id);
				const m = await head.get();
				const old = m.exists ? m.data() : null;
				const slot = old && old.slot === 0 ? 1 : 0;
				const n = Math.ceil(text.length / PART);
				for (let i = 0; i < n; i++) await col.doc("w_" + id + "_" + slot + "_" + i).set({ s: text.slice(i * PART, (i + 1) * PART) });
				await head.set({ slot, parts: n, len: text.length, saved: entry.saved });
				if (old) for (let i = 0; i < old.parts; i++) { try { await col.doc("w_" + id + "_" + old.slot + "_" + i).delete(); } catch (e) { break; } }
				entry.local = false;
				await this.setIndex(entry);
				try { localStorage.removeItem("pixelrealm.w." + id); } catch (e) {}
				return "your account";
			} catch (e) { /* falls back to this browser */ }
		}
		localStorage.setItem("pixelrealm.w." + id, text);
		entry.local = true;
		await this.setIndex(entry);
		return "this browser";
	},
	async read(id) {
		await this.init();
		if (this.db) {
			try {
				const col = this.col(), m = await col.doc("w_" + id).get();
				if (m.exists) {
					const d = m.data();
					const docs = await Promise.all(Array.from({ length: d.parts }, (_, i) => col.doc("w_" + id + "_" + d.slot + "_" + i).get()));
					let text = "";
					for (const p of docs) { if (!p.exists) throw new Error("the saved world is incomplete"); text += p.data().s; }
					return text;
				}
			} catch (e) { if (e.message.includes("incomplete")) throw e; }
		}
		const t = localStorage.getItem("pixelrealm.w." + id);
		if (!t) throw new Error("that world could not be found");
		return t;
	},
	async remove(entry) {
		await this.init();
		if (this.db) {
			try {
				const col = this.col(), m = await col.doc("w_" + entry.id).get();
				if (m.exists) { const d = m.data(); for (let i = 0; i < d.parts; i++) { try { await col.doc("w_" + entry.id + "_" + d.slot + "_" + i).delete(); } catch (e) {} } await col.doc("w_" + entry.id).delete(); }
				await this.setIndex(entry, true);
			} catch (e) {}
		}
		try { localStorage.removeItem("pixelrealm.w." + entry.id); } catch (e) {}
		try { await this.setIndex(Object.assign({}, entry, { local: true }), true); } catch (e) {}
	},
};

let saving = null, saveAgain = false;
function newWorldID() { return Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
async function saveGame(g) {
	if (g.isTest) return { where: "nowhere (test world)", size: 0 };
	if (!g.slot) g.slot = newWorldID();
	const o = makeSave(g);
	const text = await packText(o);
	const entry = { id: g.slot, name: g.worldName, mode: g.mode, seed: g.seedValue, saved: o.saved, day: g.dayCount + 1, size: text.length };
	const where = await Store.write(g.slot, text, entry);
	return { where, size: text.length };
}
/** saves in the background (autosave); a save asked for while one runs follows it */
function saveGameSoon(g) {
	if (saving) { saveAgain = true; return saving; }
	saving = saveGame(g).catch(() => { g.say("Autosave failed.", 2); }).finally(() => {
		saving = null;
		if (saveAgain) { saveAgain = false; saveGameSoon(g); }
	});
	return saving;
}
async function loadGameByID(id, settings) {
	const text = await Store.read(id);
	const o = await unpackText(text);
	const g = loadSave(o, settings);
	g.slot = id;
	return g;
}
async function exportWorld(g) {
	const text = await packText(makeSave(g));
	const name = (g.worldName || "world").replace(/[^A-Za-z0-9_-]+/g, "_") + ".pixelrealm.txt";
	await Store.init();
	if (Store.dl) { await Store.dl.save({ filename: name, data: text }); return; }
	const blob = new Blob([text], { type: "text/plain" });
	const a = document.createElement("a");
	a.href = URL.createObjectURL(blob); a.download = name; a.click();
	setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/** a world from an exported file's text, kept as a new world */
async function importWorld(text, settings) {
	const o = await unpackText(text);
	const g = loadSave(o, settings);
	g.slot = newWorldID();
	await saveGame(g);
	return g;
}

// ===== u05_menu.js =====
// The title screen (the Swift game's u05_menu): new worlds, saved worlds, importing a world file, and
// settings.

const Menu = {
	page: "main", worlds: [], sure: null, form: null, busy: false, note: "",
	init() {
		const el = $("menu");
		el.addEventListener("click", (e) => this.click(e));
		el.addEventListener("input", (e) => this.input(e));
		el.addEventListener("change", (e) => this.change(e));
	},
	show(page = "main") {
		this.page = page; this.sure = null;
		$("menu").classList.remove("hidden");
		HUD.show(false);
		if (page === "main" || page === "load") this.refreshWorlds();
		this.render();
	},
	hide() { $("menu").classList.add("hidden"); },
	async refreshWorlds() {
		try { this.worlds = await Store.list(); } catch (e) { this.worlds = []; }
		this.render();
	},
	newForm() { return { name: "My World", seed: "", mode: GameMode.survival, infinite: true, flat: false, trees: true, structures: true }; },
	render() {
		const el = $("menu");
		let h = "";
		if (this.page === "main") {
			h = '<div class="box"><div class="scroll"><div class="logo">PixelRealm</div><div class="sub">Dig, build and survive</div><div class="col">' +
				'<button data-act="new" class="primary">NEW WORLD</button>' +
				'<button data-act="load"' + (this.worlds.length ? "" : " disabled") + '>PLAY A SAVED WORLD' + (this.worlds.length ? " (" + this.worlds.length + ")" : "") + "</button>" +
				'<button data-act="import">OPEN A WORLD FILE</button><button data-act="settings">SETTINGS</button><button data-act="stress">STRESS TEST</button></div>' +
				'<div class="note">Worlds are saved to ' + Store.where + ".<br>Version 2 · phase 2 of the web edition</div></div></div>";
		} else if (this.page === "new") {
			const f = this.form || (this.form = this.newForm());
			const pick = (k, opts) => '<div class="choice">' + opts.map(([v, n]) => '<button data-pick="' + k + '" data-v="' + v + '" class="' + (String(f[k]) === String(v) ? "on" : "") + '">' + n + "</button>").join("") + "</div>";
			h = '<div class="box"><div class="top"><span class="title">New world</span><button data-act="back">BACK</button></div><div class="scroll">' +
				'<div class="field"><label>Name</label><input data-f="name" value="' + escapeHTML(f.name) + '" maxlength="40"></div>' +
				'<div class="field"><label>Seed (empty for a random one)</label><input data-f="seed" value="' + escapeHTML(f.seed) + '" maxlength="30"></div>' +
				'<div class="field"><label>Mode</label>' + pick("mode", [[0, "SURVIVAL"], [1, "CREATIVE"], [2, "HARDCORE"]]) + "</div>" +
				'<div class="field"><label>Size</label>' + pick("infinite", [[true, "ENDLESS"], [false, "SMALL (" + FINITE_WIDTH + " WIDE)"]]) + "</div>" +
				'<div class="field"><label>Land</label>' + pick("flat", [[false, "NORMAL"], [true, "FLAT"]]) + "</div>" +
				(f.flat ? '<div class="field"><label>Flat world</label>' + pick("trees", [[true, "TREES"], [false, "NO TREES"]]) + "</div>" : "") +
				'<div class="note">' + ["You gather, build and get hungry.", "Every block is yours, nothing hurts.", "One life: the world is lost if you die."][f.mode] + "</div>" +
				'<div class="col"><button data-act="create" class="primary">CREATE</button></div><div class="note" id="mnote">' + escapeHTML(this.note) + "</div></div></div>";
		} else if (this.page === "load") {
			h = '<div class="box"><div class="top"><span class="title">Saved worlds</span><button data-act="back">BACK</button></div><div class="scroll">';
			if (!this.worlds.length) h += '<div class="note">No saved worlds yet.</div>';
			for (const w of this.worlds) {
				const when = w.saved ? new Date(w.saved).toLocaleString() : "";
				h += '<div class="world"><div class="nm"><b>' + escapeHTML(w.name) + "</b><div>" + MODE_NAMES[w.mode || 0] + " · day " + (w.day || 1) + " · " + Math.ceil((w.size || 0) / 1024) + " KB · " + when + (w.local ? " · this browser" : "") + "</div></div>" +
					'<button data-play="' + w.id + '" class="primary">PLAY</button><button data-del="' + w.id + '" class="warn">' + (this.sure === w.id ? "SURE?" : "DELETE") + "</button></div>";
			}
			h += '<div class="note" id="mnote">' + escapeHTML(this.note) + "</div></div></div>";
		} else if (this.page === "import") {
			h = '<div class="box"><div class="top"><span class="title">Open a world file</span><button data-act="back">BACK</button></div><div class="scroll">' +
				'<div class="field"><label>A world file you exported (.txt)</label><input type="file" id="mfile" accept=".txt,.json,text/plain"></div>' +
				'<div class="field"><label>Or paste its text</label><textarea id="mtext" rows="5" style="font-family:var(--font);font-size:13px;background:#10141f;color:var(--text);border:2px solid var(--edge);border-radius:6px;padding:8px"></textarea></div>' +
				'<div class="col"><button data-act="doimport" class="primary">OPEN</button></div><div class="note" id="mnote">' + escapeHTML(this.note) + "</div></div></div>";
		} else if (this.page === "stress") {
			h = '<div class="box"><div class="top"><span class="title">Stress test results</span><button data-act="back">BACK</button></div><div class="scroll">' +
				'<pre style="white-space:pre-wrap;font-family:var(--font);font-size:14px;line-height:1.5;margin:0;user-select:text;-webkit-user-select:text">' + escapeHTML(Stress.report || "") + "</pre>" +
				'<div class="note">Select the text to copy it, or run it again.</div><div class="col"><button data-act="stress">RUN AGAIN</button></div></div></div>';
		} else if (this.page === "settings") {
			h = '<div class="box">' + settingsTop("back") + '<div class="scroll">' + settingsHTML(Menu.settings) + "</div></div>";
		}
		el.innerHTML = h;
	},
	say(s) { this.note = s; const n = $("mnote"); if (n) n.textContent = s; },
	async click(e) {
		const t = e.target.closest("[data-act],[data-pick],[data-play],[data-del],[data-toggle]");
		if (!t || this.busy) return;
		Sound.unlock();
		const ds = t.dataset;
		if (ds.toggle) { onSettingsToggle(Menu.settings, ds.toggle); this.render(); return; }
		if (ds.pick) {
			const f = this.form, v = ds.v;
			f[ds.pick] = v === "true" ? true : v === "false" ? false : +v;
			this.render();
			return;
		}
		if (ds.play) {
			this.busy = true; this.say("Loading…");
			try { const g = await loadGameByID(ds.play, Menu.settings); startGame(g); }
			catch (err) { this.say("Could not open it: " + err.message); }
			this.busy = false;
			return;
		}
		if (ds.del) {
			if (this.sure !== ds.del) { this.sure = ds.del; this.render(); return; }
			const w = this.worlds.find((o) => o.id === ds.del);
			this.sure = null;
			if (w) { this.busy = true; await Store.remove(w); this.busy = false; }
			await this.refreshWorlds();
			if (!this.worlds.length) this.show("main");
			return;
		}
		switch (ds.act) {
			case "new": this.form = this.newForm(); this.note = ""; this.page = "new"; this.render(); break;
			case "load": this.note = ""; this.show("load"); break;
			case "import": this.note = ""; this.page = "import"; this.render(); break;
			case "settings": this.page = "settings"; this.render(); break;
			case "back": this.show("main"); break;
			case "create": this.create(); break;
			case "doimport": this.doImport(); break;
			case "stress": Stress.start(); break;
		}
	},
	input(e) {
		const k = e.target.dataset.f;
		if (k && this.form) { this.form[k] = e.target.value; return; }
		if (e.target.dataset.set) {
			const s = Menu.settings, key = e.target.dataset.set;
			s[key] = +e.target.value;
			const lab = document.getElementById("sv_" + key);
			const row = SETTING_ROWS.find((r) => r[0] === key);
			if (lab) lab.textContent = (+s[key]).toFixed(row && row[5] >= 1 ? 0 : 2);
			SettingsStore.save(s); applySettings(s);
		}
	},
	async change(e) {
		if (e.target.id !== "mfile" || !e.target.files || !e.target.files[0]) return;
		try { $("mtext").value = (await e.target.files[0].text()).trim(); this.say("Read " + e.target.files[0].name + ". Tap OPEN."); }
		catch (err) { this.say("Could not read that file."); }
	},
	async create() {
		const f = this.form;
		let seed = f.seed.trim();
		let sv;
		if (!seed) sv = Math.floor(Math.random() * 4294967295) >>> 0;
		else if (/^-?\d+$/.test(seed)) sv = (+seed) >>> 0;
		else { sv = 2166136261; for (let i = 0; i < seed.length; i++) sv = Math.imul(sv ^ seed.charCodeAt(i), 16777619) >>> 0; }
		this.busy = true; this.say("Making the world…");
		await new Promise((r) => setTimeout(r, 30));
		try {
			const opts = f.flat ? { flat: true, trees: f.trees, structures: f.structures } : null;
			const g = new Game(f.mode, f.infinite, sv, Menu.settings, GEN_VERSION, opts, true);
			g.worldName = (f.name || "My World").trim().slice(0, 40) || "My World";
			g.slot = newWorldID();
			startGame(g);
			saveGameSoon(g);
		} catch (err) { this.say("Could not make it: " + err.message); }
		this.busy = false;
	},
	async doImport() {
		const text = ($("mtext") || {}).value || "";
		if (!text.trim()) { this.say("Choose a file or paste its text first."); return; }
		this.busy = true; this.say("Opening…");
		try { const g = await importWorld(text, Menu.settings); startGame(g); }
		catch (err) { this.say("Could not open it: " + err.message); }
		this.busy = false;
	},
};

function startGame(g) {
	UI.game = g;
	UI.hudKey = ""; UI.panelOpen = null;
	g.settings = Menu.settings;
	applySettings(g.settings);
	Menu.hide();
	$("death").classList.add("hidden");
	$("pause").classList.add("hidden");
	$("panel").classList.add("hidden");
	HUD.show(true);
	Loop.last = 0;
	if (g.dead) showDeath(g);
}
async function quitToMenu(save) {
	const g = UI.game;
	releaseAllInput();
	if (g && save && !(g.mode === GameMode.hardcore && g.hardcoreOver)) {
		const n = $("pnote");
		if (n) n.textContent = "Saving…";
		try { await saveGame(g); } catch (e) { if (n) n.textContent = "Could not save: " + e.message; return; }
	}
	if (g && g.mode === GameMode.hardcore && g.hardcoreOver && g.slot) { try { await Store.remove({ id: g.slot }); } catch (e) {} }
	UI.game = null;
	UI.panelOpen = null;
	clearSectionCache();
	$("pause").classList.add("hidden"); $("panel").classList.add("hidden"); $("death").classList.add("hidden");
	Menu.show("main");
}

// ===== u11_stress.js =====
// The stress test (from the title screen): a throwaway creative world pushed step by step (standing, flying
// fast through new land, digging out a big hole, the widest view), measuring each step. Later phases add
// their own steps (creatures, liquids, machines, vehicles) to STRESS_STEPS.

const STRESS_STEPS = [
	{ name: "Standing still", secs: 3, start(g) {}, run(g, dt) {} },
	{ name: "Flying through new land (40 blocks a second)", secs: 6, start(g) { g.noclip = true; }, run(g, dt) { g.pb.x += 40 * dt; } },
	{ name: "Digging out 3,000 blocks", secs: 4, start(g) { g.noclip = true; Stress.dug = 0; }, run(g, dt) {
		const w = g.world, px = Math.floor(g.pb.x), py = Math.floor(g.pb.y);
		for (let k = 0; k < 40 && Stress.dug < 3000; k++, Stress.dug++) { const i = Stress.dug; w.set(px - 30 + (i % 60), py + 2 + Math.floor(i / 60), T.air); }
	} },
	{ name: "Torches everywhere (light)", secs: 3, start(g) {
		const w = g.world, px = Math.floor(g.pb.x), py = Math.floor(g.pb.y);
		for (let i = 0; i < 120; i++) w.set(px - 30 + (i % 30) * 2, py + 4 + Math.floor(i / 30) * 6, T.torch);
	}, run(g, dt) {} },
	{ name: "Widest view (12 pixels a block)", secs: 4, start(g) { g.tilePx = 12; }, run(g, dt) { g.pb.x += 10 * dt; } },
	{ name: "300 monsters after you", secs: 6, start(g) {
		g.tilePx = g.settings.tilePx; g.noclip = false; g.mobs = []; g.noSpawning = true;
		g.pb.y = g.world.surfaceY(Math.floor(g.pb.x));
		const kinds = ["zombie", "skeleton", "crawler", "slime", "archer", "bat"];
		for (let i = 0; i < 300; i++) { const x = g.pb.x + rand(-45, 45); const m = g.addMob(kinds[i % kinds.length], x, g.world.surfaceY(Math.floor(x)) - (kinds[i % kinds.length] === "bat" ? 3 : 0)); m.persistent = true; }
	}, run(g, dt) {} },
	{ name: "2,000 animals", secs: 6, start(g) {
		g.mobs = [];
		const kinds = ["pig", "cow", "sheep", "chicken", "wolf", "crow"];
		for (let i = 0; i < 2000; i++) { const x = g.pb.x + rand(-60, 60); const m = g.addMob(kinds[i % kinds.length], x, g.world.surfaceY(Math.floor(x)) - (kinds[i % kinds.length] === "crow" ? 4 : 0)); m.persistent = true; }
	}, run(g, dt) {} },
];

const Stress = {
	running: false, step: 0, t: 0, frames: 0, worst: 0, results: [], g: null, dug: 0, gen0: 0,
	start() {
		const s = Object.assign({}, Menu.settings, { autosave: false });
		const g = new Game(GameMode.creative, true, 20240611, s, GEN_VERSION, null, true);
		g.isTest = true; g.worldName = "Stress test";
		this.g = g; this.running = true; this.step = -1; this.results = [];
		startGame(g);
		this.next();
	},
	next() {
		const g = this.g;
		if (this.step >= 0) {
			const st = STRESS_STEPS[this.step];
			this.results.push({ name: st.name, fps: this.frames / Math.max(0.001, this.t), worst: this.worst * 1000, chunks: PERF.chunksGenerated - this.gen0, gen: PERF.genMs, light: PERF.lightMs, draw: PERF.renderMs, tick: g.tickMs });
		}
		this.step++;
		if (this.step >= STRESS_STEPS.length) { this.finish(); return; }
		this.t = 0; this.frames = 0; this.worst = 0; this.gen0 = PERF.chunksGenerated;
		STRESS_STEPS[this.step].start(g);
		g.say("Stress test " + (this.step + 1) + "/" + STRESS_STEPS.length + ": " + STRESS_STEPS[this.step].name, STRESS_STEPS[this.step].secs);
	},
	update(dt) {
		if (!this.running || UI.game !== this.g) { this.running = false; return; }
		this.t += dt; this.frames++;
		if (this.t > 0.3) this.worst = Math.max(this.worst, dt);
		STRESS_STEPS[this.step].run(this.g, dt);
		if (this.t >= STRESS_STEPS[this.step].secs) this.next();
	},
	finish() {
		this.running = false;
		const gl = R.gl;
		let gpu = "";
		try { const ext = gl.getExtension("WEBGL_debug_renderer_info"); gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch (e) {}
		const lines = ["PixelRealm web, phase 2 stress test"];
		for (const r of this.results) lines.push(r.name + ": " + Math.round(r.fps) + " fps (slowest frame " + Math.round(r.worst) + " ms)" + (r.chunks ? ", " + r.chunks + " chunks made at " + r.gen.toFixed(1) + " ms each" : "") + ", light " + r.light.toFixed(1) + " ms, game " + r.tick.toFixed(1) + " ms");
		lines.push("Screen " + window.innerWidth + "x" + window.innerHeight + " at " + R.dpr + "x, GPU " + gpu + ", largest texture " + gl.getParameter(gl.MAX_TEXTURE_SIZE));
		Stress.report = lines.join("\n");
		quitToMenu(false).then(() => { Menu.page = "stress"; Menu.render(); });
	},
};

// ===== main.js =====
// Starting up and the frame loop.

const Loop = {
	last: 0, fps: 60, frames: 0,
	frame(t) {
		requestAnimationFrame((tt) => Loop.frame(tt));
		const dt = Loop.last ? (t - Loop.last) / 1000 : 1 / 60;
		Loop.last = t;
		Loop.frames++;
		if (dt > 0) Loop.fps = Loop.fps * 0.95 + Math.min(240, 1 / dt) * 0.05;
		const g = UI.game;
		if (!g) { R.begin(0.04, 0.06, 0.1); R.end(); return; }
		g.viewW = window.innerWidth; g.viewH = window.innerHeight;
		try {
			if (Stress.running) Stress.update(dt);
			if (!UI.panelOpen && !g.paused) g.applyActButton();
			g.tick(dt);
			HUD.update(g);
			if (UI.panelOpen === "inventory") renderPanel();
			if (g.dead && !UI.panelOpen) showDeath(g);
			Renderer.draw(g);
		} catch (e) {
			Loop.fail(e);
		}
	},
	failed: false,
	fail(e) {
		if (this.failed) return;
		this.failed = true;
		console.error(e);
		const g = UI.game;
		if (g) g.say("Something went wrong: " + (e && e.message ? e.message : e), 8);
		setTimeout(() => { this.failed = false; }, 4000);
	},
};

async function boot() {
	const canvas = $("world");
	try {
		if (!R.init(canvas)) { $("loading").textContent = "This device cannot show WebGL 2, which the game needs."; return; }
	} catch (e) { $("loading").textContent = "The renderer could not start: " + e.message; return; }
	R.resize();
	window.addEventListener("resize", () => { R.resize(); UI.hudKey = ""; });
	try { await loadAtlas(); } catch (e) { $("loading").textContent = "The art could not be read: " + e.message; return; }
	Painter.init();
	Menu.settings = SettingsStore.load();
	applySettings(Menu.settings);
	HUD.init();
	initPanels();
	Menu.init();
	Store.init().then(() => { if (!UI.game && Menu.page === "main") Menu.refreshWorlds(); });
	$("loading").classList.add("hidden");
	Menu.show("main");
	requestAnimationFrame((t) => Loop.frame(t));
	// leaving the page saves the world
	document.addEventListener("visibilitychange", () => { if (document.hidden && UI.game && UI.game.settings.autosave) saveGameSoon(UI.game); });
}
boot();
